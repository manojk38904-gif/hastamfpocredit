<style>
/* Layout: landing = two doors; staff = side rail + work area; documents = A4 paper sheets */
:root{
  --bg:#f2f4ef; --surface:#ffffff; --surface2:#e8ece3; --ink:#18241d; --muted:#5b6b60; --line:#d3dacd;
  --brand:#1f5b40; --brand-ink:#ffffff; --brand-soft:#dcebe2; --accent:#a8700c; --accent-soft:#f6ead2;
  --ok:#1d7745; --ok-soft:#dcf0e3; --warn:#9a5c00; --warn-soft:#fbecd2; --bad:#b3261e; --bad-soft:#f9dedb; --info:#22598a; --info-soft:#dde9f5;
  --f-body:"Mukta","Noto Sans Devanagari","Nirmala UI",system-ui,sans-serif;
  --f-disp:"Tiro Devanagari Hindi","Mukta",Georgia,serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1512; --surface:#16201b; --surface2:#1d2a23; --ink:#e3ebe5; --muted:#9db0a3; --line:#2c3b33;
  --brand:#62c08f; --brand-ink:#07130c; --brand-soft:#1f3a2d; --accent:#e2aa45; --accent-soft:#3a2d14;
  --ok:#66d196; --ok-soft:#173326; --warn:#eaa955; --warn-soft:#3a2a12; --bad:#f07f76; --bad-soft:#3d1c1a; --info:#82b8e6; --info-soft:#18293a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1512; --surface:#16201b; --surface2:#1d2a23; --ink:#e3ebe5; --muted:#9db0a3; --line:#2c3b33;
  --brand:#62c08f; --brand-ink:#07130c; --brand-soft:#1f3a2d; --accent:#e2aa45; --accent-soft:#3a2d14;
  --ok:#66d196; --ok-soft:#173326; --warn:#eaa955; --warn-soft:#3a2a12; --bad:#f07f76; --bad-soft:#3d1c1a; --info:#82b8e6; --info-soft:#18293a; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
h1,h2,h3{text-wrap:balance;margin:0;line-height:1.25}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:1100px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.num,td.n,th.n{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--brand);background:var(--brand);color:var(--brand-ink);padding:9px 16px;border-radius:8px;cursor:pointer;font-weight:600;white-space:nowrap;text-decoration:none}
.btn:hover{filter:brightness(1.07)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--brand)}
.btn.warn{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.acc{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.sm{padding:5px 11px;font-size:13.5px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.pill{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12.5px;font-weight:600;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}.pill.warn{background:var(--warn-soft);color:var(--warn)}.pill.bad{background:var(--bad-soft);color:var(--bad)}.pill.info{background:var(--info-soft);color:var(--info)}.pill.muted{background:var(--surface2);color:var(--muted)}
.req{color:var(--bad);font-style:normal}
/* landing */
.land-h{background:var(--brand);color:var(--brand-ink);padding-block:34px 30px}
.land-h .wrap{display:flex;gap:18px;align-items:center}
.seal{flex:none;width:64px;height:64px;border-radius:50%;border:2px solid currentColor;display:grid;place-items:center;font-family:var(--f-disp);font-size:32px}
.seal.sm{width:38px;height:38px;font-size:19px;border-width:1.5px}
.eyebrow{font-size:13px;letter-spacing:.06em;opacity:.85}
.land-h h1{font-family:var(--f-disp);font-weight:400;font-size:clamp(24px,4.4vw,38px)}
.land-h .en{margin:4px 0 0;font-size:13px;letter-spacing:.08em;opacity:.85}
.land-main{padding-block:34px 48px}
.lede{font-size:18px;margin:0 0 22px;max-width:60ch}
.doors{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px}
.door{display:flex;flex-direction:column;align-items:flex-start;gap:10px;text-align:left;padding:26px;border-radius:14px;border:1px solid var(--line);background:var(--surface);cursor:pointer;min-height:200px;transition:border-color .15s,transform .15s}
.door:hover{border-color:var(--brand);transform:translateY(-2px)}
.door svg{width:44px;height:44px;color:var(--brand)}
.door.cust svg{color:var(--accent)}
.door b{font-size:22px;font-family:var(--f-disp);font-weight:400}
.door span{color:var(--muted)}
.door .go{margin-top:auto;font-weight:600;color:var(--brand)}
.door.cust .go{color:var(--accent)}
.addr{margin-top:28px;font-size:13px;color:var(--muted)}
/* auth */
.auth{max-width:420px;margin:48px auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.auth h2{font-family:var(--f-disp);font-weight:400;font-size:26px;margin-bottom:4px}
.stack{display:flex;flex-direction:column;gap:12px}
/* forms */
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld>span{font-size:13.5px;font-weight:600;color:var(--muted)}
.fld.full{grid-column:1/-1}
input,select,textarea{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:var(--surface);min-width:0}
input[readonly]{background:var(--surface2)}
textarea{resize:vertical}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px 14px}
.sec{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:14px}
.sec>h3{font-size:17px;color:var(--brand)}
.radios{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.radio{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:8px;padding:10px;cursor:pointer}
.radio input{width:auto;margin-top:5px}
.radio span{display:flex;flex-direction:column}
.radio small{color:var(--muted)}
.radio:has(input:checked){border-color:var(--brand);background:var(--brand-soft)}
.check{display:flex;gap:10px;align-items:flex-start}
.check input{width:auto;margin-top:5px}
/* customer */
.cust-top{background:var(--surface);border-bottom:1px solid var(--line);padding-block:12px}
.cust-top .wrap{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.steps{display:flex;gap:6px;flex-wrap:wrap;margin:20px 0 6px}
.step{padding:6px 14px;border-radius:99px;background:var(--surface2);color:var(--muted);font-weight:600;font-size:14px}
.step.on{background:var(--brand);color:var(--brand-ink)}
.step.done{background:var(--brand-soft);color:var(--brand)}
.cust-body{display:flex;flex-direction:column;gap:16px;padding-block:10px 40px}
/* files */
.ftiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.ftile{border:1px dashed var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:10px;background:var(--surface)}
.ftile.has{border-style:solid;border-color:var(--brand)}
.ft-h{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}
.th{width:72px;height:72px;border-radius:8px;border:1px solid var(--line);background:var(--surface2) center/cover no-repeat;cursor:pointer;position:relative;padding:0}
.th.pdf::after{content:"PDF";position:absolute;inset:0;display:grid;place-items:center;font-weight:700;color:var(--bad)}
.th.miss::after{content:"?";position:absolute;inset:0;display:grid;place-items:center;color:var(--muted)}
.th .x{position:absolute;top:-7px;right:-7px;width:22px;height:22px;border-radius:50%;border:none;background:var(--bad);color:#fff;font-size:13px;line-height:22px;cursor:pointer;padding:0}
.ftile label.btn{align-self:flex-start}
/* shell */
.shell{display:grid;grid-template-columns:230px minmax(0,1fr);min-height:100vh}
.side{background:var(--surface);border-right:1px solid var(--line);padding:16px 12px;display:flex;flex-direction:column;gap:14px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;gap:10px;align-items:center;color:var(--brand);padding:0 6px}
.brand b{display:block;font-family:var(--f-disp);font-weight:400;font-size:18px;color:var(--ink)}
.brand small{color:var(--muted)}
.side nav{display:flex;flex-direction:column;gap:2px}
.nv{display:flex;justify-content:space-between;align-items:center;text-align:left;border:none;background:none;padding:8px 10px;border-radius:7px;cursor:pointer;font-weight:500}
.nv:hover{background:var(--surface2)}
.nv.on{background:var(--brand-soft);color:var(--brand);font-weight:700}
.nv i{font-style:normal;background:var(--accent);color:#fff;border-radius:99px;font-size:11.5px;padding:0 7px;font-weight:700}
.me{margin-top:auto;border-top:1px solid var(--line);padding:12px 6px 0;display:flex;flex-direction:column;gap:4px;align-items:flex-start}
.me small{color:var(--muted)}
.main{padding-block:22px 48px;padding-left:max(22px,env(safe-area-inset-left,0px));padding-right:max(22px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px;min-width:0}
.demo{background:var(--warn-soft);color:var(--warn);padding:8px 12px;border-radius:8px;font-size:13.5px}
.ph{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.ph h2{font-family:var(--f-disp);font-weight:400;font-size:28px}
.ph p{margin:2px 0 0;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.stat small{color:var(--muted);display:block}
.stat b{font-size:22px;font-variant-numeric:tabular-nums}
.pipe{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
.pipe button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px;text-align:left;cursor:pointer}
.pipe button b{display:block;font-size:22px;font-variant-numeric:tabular-nums}
.pipe button small{color:var(--muted)}
.tw{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
table.t{width:100%;border-collapse:collapse;font-size:14px}
.t th{text-align:left;font-size:12.5px;letter-spacing:.03em;color:var(--muted);font-weight:600;background:var(--surface2);padding:8px 10px;white-space:nowrap}
.t td{padding:8px 10px;border-top:1px solid var(--line);vertical-align:top}
.t td.n,.t th.n{text-align:right;white-space:nowrap}
.t tr.click{cursor:pointer}
.t tr.click:hover td{background:var(--surface2)}
.t tr.paid td{color:var(--muted)}
.t tr.od td{background:var(--bad-soft)}
.t tfoot td{font-weight:700;background:var(--surface2)}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end}
.filters .fld{width:auto;min-width:150px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:4px 12px;cursor:pointer;font-size:13.5px}
.chip.on{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.detail{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:18px;align-items:start}
.dl{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px 16px;margin:0}
.dl div{min-width:0}
.dl dt{font-size:12.5px;color:var(--muted)}
.dl dd{margin:0;font-weight:500;overflow-wrap:anywhere}
.act{border:2px solid var(--accent);background:var(--surface);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;position:sticky;top:12px}
.act h3{color:var(--accent);font-size:17px}
.photo{width:110px;height:136px;border-radius:8px;border:1px solid var(--line);background:var(--surface2) center/cover no-repeat;flex:none}
.log{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.log li{border-left:3px solid var(--brand);padding-left:10px}
.log small{color:var(--muted);display:block}
.note{background:var(--info-soft);color:var(--info);padding:10px 12px;border-radius:8px;font-size:14px}
.note.w{background:var(--warn-soft);color:var(--warn)}
.note.b{background:var(--bad-soft);color:var(--bad)}
.prev{background:var(--surface2);border-radius:8px;padding:10px;font-size:14px;display:grid;gap:4px}
.prev div{display:flex;justify-content:space-between;gap:8px}
/* modal, toasts, busy */
#modal{position:fixed;inset:0;background:rgba(10,20,14,.55);z-index:50;display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:max(20px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 20px max(12px,env(safe-area-inset-left,0px))}
.mbox{background:var(--surface);border-radius:12px;width:min(520px,100%);padding:18px;display:flex;flex-direction:column;gap:12px}
.mbox.wide{width:min(900px,100%)}
.m-h{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.paperwrap{overflow:auto;background:var(--surface2);border-radius:8px;padding:12px;max-height:72vh}
.bigimg{max-width:100%;max-height:75vh;display:block;margin:0 auto;border-radius:6px}
#toasts{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:max(16px,env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px;z-index:60}
.toast{background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:8px;max-width:340px;box-shadow:0 6px 20px rgba(0,0,0,.2)}
.toast.bad{background:var(--bad);color:#fff}
#busy{position:fixed;inset:0;z-index:70;background:rgba(10,20,14,.35);display:grid;place-items:center}
#busy div{background:var(--surface);padding:14px 20px;border-radius:10px;font-weight:600}
.pwwrap{position:relative;display:block}
.pwwrap input{padding-right:84px}
.pwbtn{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:none;background:var(--surface2);color:var(--brand);font-weight:600;font-size:13px;padding:4px 10px;border-radius:6px;cursor:pointer}
.lang{display:inline-flex;border:1px solid currentColor;border-radius:99px;overflow:hidden;font-size:13px;flex:none}
.lang button{border:none;background:transparent;color:inherit;padding:4px 12px;cursor:pointer;font-weight:600}
.lang button.on{background:currentColor}
.lang button.on span{color:var(--bg)}
.land-h .lang button.on span{color:var(--brand)}
.land-top{display:flex;justify-content:flex-end;margin-bottom:10px}
.loading{padding:60px 16px;text-align:center;color:var(--muted)}
/* paper documents: fixed print colours by design */
.paper{width:794px;background:#fff;color:#141414;padding:34px 40px;font-family:"Mukta","Noto Sans Devanagari",sans-serif;font-size:12.5px;line-height:1.45;margin:0 auto}
.paper .p-head{text-align:center;border-bottom:2px solid #1f5b40;padding-bottom:8px;margin-bottom:10px}
.paper .p-co{font-weight:700;font-size:16px;letter-spacing:.04em;color:#1f5b40}
.paper .p-cohi{font-family:"Tiro Devanagari Hindi",serif;font-size:14px}
.paper .p-addr{font-size:10.5px;color:#444}
.paper .p-title{margin-top:6px;font-weight:700;font-size:15px;letter-spacing:.08em}
.paper .p-meta{display:flex;justify-content:space-between;gap:10px;font-size:12px;margin-bottom:8px}
.paper h4{margin:12px 0 4px;font-size:13px;background:#e9efe9;padding:4px 8px;color:#1f5b40}
.paper table{width:100%;border-collapse:collapse}
.paper td,.paper th{border:1px solid #9aa79f;padding:4px 7px;vertical-align:top;text-align:left}
.paper th{background:#f1f4f1;font-weight:600}
.paper td.k{width:38%;color:#333;background:#fafbfa}
.paper td.n,.paper th.n{text-align:right;font-variant-numeric:tabular-nums}
.paper tr.hl td{background:#fdf1d6;font-weight:600}
.paper .p-photo{width:110px;height:136px;border:1px solid #777;object-fit:cover;display:block}
.paper .p-photo.empty{display:grid;place-items:center;color:#777;font-size:11px}
.paper .sigs{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:40px}
.paper .sigs div{border-top:1px solid #333;padding-top:4px;text-align:center;font-size:11.5px}
.paper p{margin:6px 0}
.paper .small{font-size:11px;color:#444}
.pdfhost{position:absolute;left:-12000px;top:0}
@media (max-width:860px){
  .shell{grid-template-columns:1fr}
  .side{position:static;height:auto;border-right:none;border-bottom:1px solid var(--line);padding:10px 12px;gap:8px}
  .side nav{flex-direction:row;overflow-x:auto;gap:4px;padding-bottom:4px}
  .nv{white-space:nowrap;gap:6px}
  .me{flex-direction:row;align-items:center;gap:10px;border-top:none;padding:0 6px;margin:0;flex-wrap:wrap}
  .detail{grid-template-columns:1fr}
  .act{position:static}
  .main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<script>
"use strict";
/* ============ utilities ============ */
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const r2=n=>Math.round(((+n)||0)*100)/100;
const fmt=n=>'₹'+r2(n).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});
const fmtD=d=>d?String(d).slice(0,10).split('-').reverse().join('-'):'';
const fmtDT=iso=>{try{return new Date(iso).toLocaleString('en-IN',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'})}catch(e){return iso}};
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const today=()=>iso(new Date());
const nowISO=()=>new Date().toISOString();
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const pad=n=>String(n).padStart(4,'0');
const clone=o=>JSON.parse(JSON.stringify(o));
function addMonths(s,m){const [y,mo,d]=s.split('-').map(Number);const t=new Date(y,mo-1+m,1);const last=new Date(t.getFullYear(),t.getMonth()+1,0).getDate();t.setDate(Math.min(d,last));return iso(t)}
function fyCode(s){const [y,m]=s.split('-').map(Number);const st=m>=4?y:y-1;return String(st%100).padStart(2,'0')+String((st+1)%100).padStart(2,'0')}
function inWords(num){num=Math.round(+num||0);if(!num)return 'Rupees Zero Only';
  const a=['','One','Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten','Eleven','Twelve','Thirteen','Fourteen','Fifteen','Sixteen','Seventeen','Eighteen','Nineteen'];
  const b=['','','Twenty','Thirty','Forty','Fifty','Sixty','Seventy','Eighty','Ninety'];
  const two=n=>n<20?a[n]:b[Math.floor(n/10)]+(n%10?' '+a[n%10]:'');
  const three=n=>(n>=100?a[Math.floor(n/100)]+' Hundred'+(n%100?' ':''):'')+(n%100?two(n%100):'');
  let s='';const cr=Math.floor(num/1e7);num%=1e7;const lk=Math.floor(num/1e5);num%=1e5;const th=Math.floor(num/1000);num%=1000;
  if(cr)s+=three(cr)+' Crore ';if(lk)s+=two(lk)+' Lakh ';if(th)s+=two(th)+' Thousand ';if(num)s+=three(num);
  return 'Rupees '+s.trim()+' Only'}
function toast(msg,kind='ok'){const t=document.createElement('div');t.className='toast '+kind;t.textContent=tr(msg);$('#toasts').appendChild(t);setTimeout(()=>t.remove(),4200)}
function busy(on){$('#busy').hidden=!on}
function pwToggles(root){(root||document).querySelectorAll('input[type=password]:not([data-pw])').forEach(i=>{i.dataset.pw='1';const w=document.createElement('span');w.className='pwwrap';i.parentNode.insertBefore(w,i);w.appendChild(i);
  const b=document.createElement('button');b.type='button';b.className='pwbtn';b.textContent='👁 दिखाएं';b.setAttribute('aria-label','पासवर्ड दिखाएं');
  b.addEventListener('click',e=>{e.preventDefault();const show=i.type==='password';i.type=show?'text':'password';b.textContent=tr(show?'🙈 छिपाएं':'👁 दिखाएं');b.setAttribute('aria-label',tr(show?'पासवर्ड छिपाएं':'पासवर्ड दिखाएं'));i.focus()});w.appendChild(b)})}
function modal(html,wide){const m=$('#modal');m.innerHTML=`<div class="mbox ${wide?'wide':''}">${html}</div>`;m.hidden=false;pwToggles(m);trDom(m)}
function closeModal(){const m=$('#modal');m.hidden=true;m.innerHTML=''}
function ss(k,v){try{if(v===undefined)return sessionStorage.getItem('hfpo_'+k);if(v===null)sessionStorage.removeItem('hfpo_'+k);else sessionStorage.setItem('hfpo_'+k,v)}catch(e){return null}}

let EN_RE=null;
function tr(s){if(LANG!=='en'||!s||!/[\u0900-\u097F]/.test(s))return s;
  if(!EN_RE){const ks=Object.keys(EN).sort((a,b)=>b.length-a.length).map(k=>k.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'));EN_RE=new RegExp('(?<![\\u0900-\\u097F])('+ks.join('|')+')(?![\\u0900-\\u097F])','g')}
  return s.replace(EN_RE,m=>EN[m])}
function trDom(root){if(LANG!=='en'||!root)return;
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:n=>{const p=n.parentNode;if(!p||/^(TEXTAREA|SCRIPT|STYLE)$/.test(p.nodeName)||(p.closest&&p.closest('[data-notr]')))return NodeFilter.FILTER_REJECT;return /[\u0900-\u097F]/.test(n.nodeValue)?NodeFilter.FILTER_ACCEPT:NodeFilter.FILTER_SKIP}});
  const ns=[];while(w.nextNode())ns.push(w.currentNode);
  ns.forEach(n=>{const p=n.parentNode;if(p.nodeName==='OPTION'&&!p.hasAttribute('value'))p.setAttribute('value',n.nodeValue);n.nodeValue=tr(n.nodeValue)});
  root.querySelectorAll('[placeholder],[aria-label],[title]').forEach(e=>['placeholder','aria-label','title'].forEach(a=>{if(e.hasAttribute(a))e.setAttribute(a,tr(e.getAttribute(a)))}))}

const FBC=window.HFPO_FIREBASE||{};const EMAIL_DOMAIN='@hastam-fpo.in';
const FB={app:null,auth:null,fs:null,unsubs:[],staff:null};
const toEmail=u=>u.includes('@')?u:u+EMAIL_DOMAIN;
function fbListen(ref,coll){return new Promise(res=>{let first=true;const done=()=>{if(first){first=false;res()}};
  const un=ref.onSnapshot(snap=>{const o={};snap.forEach(d=>{o[d.id]=Object.assign({id:d.id},d.data())});S.cache[coll]=o;if(first)done();else emit()},err=>{console.warn('fb',coll,err);done()});
  FB.unsubs.push(un);setTimeout(done,10000)})}
async function fbAttach(){FB.unsubs.forEach(u=>{try{u()}catch(e){}});FB.unsubs=[];FB.staff=null;S.cache.users={};S.cache.apps={};S.cache.entries={};
  const u=FB.auth.currentUser;if(!u)return;
  let sd=null;try{const d=await FB.fs.doc('users/'+u.uid).get();sd=d.exists?d.data():null}catch(e){sd=null}
  if(sd&&sd.active!==false){FB.staff=Object.assign({id:u.uid},sd);await Promise.all([fbListen(FB.fs.collection('users'),'users'),fbListen(FB.fs.collection('apps'),'apps'),fbListen(FB.fs.collection('entries'),'entries')])}
  else await fbListen(FB.fs.collection('apps').where('ownerUid','==',u.uid),'apps')}
function fbErr(e){const c=(e&&e.code)||'';if(c.includes('permission'))return 'अनुमति नहीं है (permission denied) – Firestore Rules जाँचें';if(c.includes('unavailable'))return 'इंटरनेट कनेक्शन जाँचें';
  if(['auth/invalid-credential','auth/wrong-password','auth/user-not-found','auth/invalid-email','auth/invalid-login-credentials'].includes(c))return 'यूज़रनेम या पासवर्ड गलत है';
  if(c==='auth/email-already-in-use')return 'यह यूज़रनेम पहले से बना हुआ है';if(c==='auth/weak-password')return 'पासवर्ड कम से कम 6 अक्षर का हो';
  if(c==='auth/operation-not-allowed')return 'Firebase में Email/Password और Anonymous लॉगिन चालू करें';if(c==='auth/requires-recent-login')return 'लॉग आउट करके दोबारा लॉगिन करें, फिर पासवर्ड बदलें';
  if(c==='auth/too-many-requests')return 'बहुत अधिक प्रयास – कुछ देर बाद कोशिश करें';return (e&&e.message)||'त्रुटि'}
async function initStore(){
  if(window.firebase&&FBC.apiKey){S.mode='fb';
    FB.app=firebase.initializeApp(FBC);FB.auth=firebase.auth();FB.fs=firebase.firestore();
    await new Promise(res=>{const un=FB.auth.onAuthStateChanged(()=>{un();res()})});
    S.cache.config={};
    await Promise.all([fbListen(FB.fs.collection('settings'),'settings'),fbListen(FB.fs.collection('config'),'config')]);
    FB.unsubs=[];/* settings/config listeners stay on */
    await fbAttach();return}
  let db=null;
  try{if(window.claude&&typeof window.claude.use==='function')db=await window.claude.use('db')}catch(e){db=null}
  if(db){
    S.mode='db';S.db=db;
    await Promise.all(COLLS.map(c=>new Promise(res=>{let first=true;const done=()=>{if(first){first=false;res()}};
      try{db.collection(c).onSnapshot(snap=>{const o={};snap.docs.forEach(d=>{o[d.id]=Object.assign({id:d.id},d.data())});S.cache[c]=o;if(first)done();else emit()},err=>{console.warn('db',c,err);done()})}catch(e){done()}
      setTimeout(done,9000)})));
  }else{COLLS.forEach(c=>S.cache[c]=lsGet(c)||{})}
}
async function put(c,id,data){
  const doc=clone(data);delete doc.id;
  if(S.mode==='fb'){try{await FB.fs.collection(c).doc(id).set(doc)}catch(e){throw new Error(fbErr(e))}}
  else if(S.mode==='db'){try{await S.db.collection(c).doc(id).set(doc)}catch(e){if(e&&e.code==='unavailable'){await sleep(600);await S.db.collection(c).doc(id).set(doc)}else throw new Error(e&&e.code==='invalid_argument'?'आपको यह जानकारी सहेजने की अनुमति नहीं है।':(e&&e.message)||'सहेजा नहीं जा सका')}}
  S.cache[c]=Object.assign({},S.cache[c],{[id]:Object.assign({id},doc)});
  if(S.mode==='local'&&!lsSet(c,S.cache[c]))throw new Error('ब्राउज़र स्टोरेज भर गया');
  emit();
}

async function nextNo(key,cnt){cnt=cnt||1;
  if(S.mode==='fb'){const ref=FB.fs.doc('meta/counters');try{return await FB.fs.runTransaction(async t=>{const s=await t.get(ref);const d=s.exists?s.data():{};const n=(+d[key]||0)+cnt;t.set(ref,{[key]:n},{merge:true});return n})}catch(e){throw new Error(fbErr(e))}}
  if(S.mode==='db'){const ref=S.db.doc('meta/counters');const holder=uid();
    for(let i=0;i<25;i++){const r=await ref.acquire({holder,ttlMs:5000});
      if(r.acquired){const s=await ref.get();const d=s.exists?Object.assign({},s.data()):{};const n=(+d[key]||0)+cnt;d[key]=n;await ref.set(d);return n}
      await sleep(250+Math.random()*400)}
    throw new Error('क्रमांक जारी नहीं हो सका, पुनः प्रयास करें')}
  const d=lsGet('counters')||{};d[key]=(+d[key]||0)+cnt;lsSet('counters',d);return d[key]}

/* ============ loan maths ============ */
function genSchedule(P,rate,n,method,start){P=r2(P);n=+n;const r=(+rate)/1200;const rows=[];let bal=P;
  if(method==='emi'){const emi=r?Math.round(P*r*Math.pow(1+r,n)/(Math.pow(1+r,n)-1)):Math.round(P/n);
    for(let i=1;i<=n;i++){const it=r2(bal*r);let pr=r2(emi-it);if(i===n||pr>bal)pr=bal;const open=bal;bal=r2(bal-pr);rows.push({n:i,due:addMonths(start,i),open,int:it,prin:pr,bal})}}
  else if(method==='bullet'){for(let i=1;i<=n;i++){const it=r2(P*r);const pr=i===n?P:0;const open=bal;bal=r2(bal-pr);rows.push({n:i,due:addMonths(start,i),open,int:it,prin:pr,bal})}}
  else{const q=Math.ceil(n/3);const qp=r2(P/q);for(let i=1;i<=n;i++){const it=r2(bal*r);let pr=0;if(i%3===0||i===n)pr=(i===n)?bal:Math.min(qp,bal);const open=bal;bal=r2(bal-pr);rows.push({n:i,due:addMonths(start,i),open,int:it,prin:pr,bal})}}
  return rows.map(x=>Object.assign(x,{amt:r2(x.int+x.prin),pInt:0,pPrin:0}))}
function loanStats(L){let pPaid=0,iPaid=0,pTot=0,iTot=0,overdue=0,next=null;const t=today();
  for(const x of L.schedule){pTot+=x.prin;iTot+=x.int;pPaid+=x.pPrin;iPaid+=x.pInt;const rem=r2(x.int+x.prin-x.pInt-x.pPrin);if(rem>0.004){if(x.due<=t)overdue+=rem;if(!next)next=x}}
  return {pTot:r2(pTot),iTot:r2(iTot),pPaid:r2(pPaid),iPaid:r2(iPaid),pOut:r2(pTot-pPaid),iOut:r2(iTot-iPaid),overdue:r2(overdue),next,nextDue:next?r2(next.int+next.prin-next.pInt-next.pPrin):0,totalOut:r2(pTot+iTot-pPaid-iPaid)}}
function allocate(L,amt){const sch=clone(L.schedule);let rem=r2(amt),I=0,P=0;
  for(const x of sch){if(rem<=0.004)break;const di=r2(x.int-x.pInt);if(di>0){const t=Math.min(rem,di);x.pInt=r2(x.pInt+t);I+=t;rem=r2(rem-t)}
    if(rem<=0.004)break;const dp=r2(x.prin-x.pPrin);if(dp>0){const t=Math.min(rem,dp);x.pPrin=r2(x.pPrin+t);P+=t;rem=r2(rem-t)}}
  return {sch,I:r2(I),P:r2(P),rem}}

const loadImg=u=>new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>rej(new Error('यह फोटो प्रारूप समर्थित नहीं है — JPG/PNG अपलोड करें'));i.src=u});
async function compressImg(f){const img=await loadImg(await readURL(f));let max=1600,q=0.78,out='';
  for(let i=0;i<9;i++){const s=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.max(1,Math.round(img.width*s));c.height=Math.max(1,Math.round(img.height*s));const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(img,0,0,c.width,c.height);out=c.toDataURL('image/jpeg',q);if(out.length<230000)return out;max*=0.8;q=Math.max(0.5,q-0.05)}
  return out}

async function showDoc(kind,id){busy(true);let html='',title='',fname='';
  try{if(kind==='app'){const a=S.cache.apps[id];html=await docApplication(a);title='ऋण आवेदन पत्र';fname=a.id+'-Application.pdf'}

    else if(kind==='receipt'){const e=S.cache.entries[id];html=docReceipt(e.receipt);title='किस्त रसीद';fname=e.receipt.rno+'-Receipt.pdf'}}
  finally{busy(false)}
  A._pdf=fname;modal(`<div class="m-h"><b>${title}</b><div class="row"><button class="btn" onclick="A.pdf()">PDF डाउनलोड (प्रिंट हेतु)</button><button class="btn ghost" onclick="A.closeModal()">बंद करें</button></div></div><div class="paperwrap"><div class="paper" id="paperDoc">${html}</div></div>`,true)}
async function makePdf(srcHtml,filename){
  if(!window.html2canvas||!window.jspdf)throw new Error('PDF लाइब्रेरी लोड नहीं हुई — इंटरनेट जाँचें');
  const host=document.createElement('div');host.className='pdfhost';host.innerHTML=`<div class="paper">${srcHtml}</div>`;document.body.appendChild(host);
  try{const el=host.firstChild;try{await document.fonts.ready}catch(e){}
    await Promise.all([...el.querySelectorAll('img')].map(i=>i.complete?0:new Promise(r=>{i.onload=i.onerror=r})));
    const W=794,top=el.getBoundingClientRect().top;const pdf=new window.jspdf.jsPDF({unit:'pt',format:'a4'});const pw=pdf.internal.pageSize.getWidth(),phPt=pdf.internal.pageSize.getHeight();const k=pw/W;const PH=Math.floor(phPt/k);
    const bps=[...el.querySelectorAll('tr,p,h4,.sigs,.p-head,.p-meta')].map(e=>Math.round(e.getBoundingClientRect().bottom-top)).sort((a,b)=>a-b);
    const total=el.offsetHeight;const cuts=[0];let st=0;while(total-st>PH){let c=bps.filter(b=>b>st+150&&b<=st+PH).pop();if(!c)c=st+PH;cuts.push(c);st=c}cuts.push(total);
    const canvas=await window.html2canvas(el,{scale:2,backgroundColor:'#ffffff',useCORS:true,logging:false});
    for(let i=0;i<cuts.length-1;i++){const h=cuts[i+1]-cuts[i];if(h<=0)continue;const c=document.createElement('canvas');c.width=canvas.width;c.height=Math.round(h*2);const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(canvas,0,Math.round(cuts[i]*2),canvas.width,Math.round(h*2),0,0,c.width,c.height);
      if(i>0)pdf.addPage();pdf.addImage(c.toDataURL('image/jpeg',0.92),'JPEG',0,i>0?20:0,pw,h*k)}
    return pdf}finally{host.remove()}}
async function saveBlob(filename,blob,pdfObj){
  if(!window.claude){try{const u=URL.createObjectURL(blob);const a=document.createElement('a');a.href=u;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),5000);return true}catch(e){if(pdfObj)pdfObj.save(filename);return true}}
  let dl=null;try{dl=await window.claude.use('downloads')}catch(e){}
  if(!dl){toast('इस दृश्य में डाउनलोड उपलब्ध नहीं है','bad');return false}
  try{const r=await dl.save({filename,data:blob});if(r&&r.status==='saved')toast('फाइल सहेजी गई');return true}catch(e){if(e&&e.code!=='declined')toast('डाउनलोड नहीं हो सका: '+(e.message||e.code),'bad');return false}}

VIEWS.loan=p=>{const a=S.cache.apps[p.id];if(!a||!a.loan)return shell('<div class="note b">ऋण खाता नहीं मिला।</div>');const L=a.loan,st=loanStats(L),t=today();
  const ent=Object.values(S.cache.entries).filter(e=>e.appId===a.id).sort((x,y)=>x.date===y.date?(x.at||'').localeCompare(y.at||''):x.date.localeCompare(y.date));let bal=0;

  `<div class="stats"><div class="stat"><small>वितरित मूलधन</small><b>${fmt(L.principal)}</b></div><div class="stat"><small>जमा मूलधन / ब्याज</small><b>${fmt(st.pPaid)}</b><small>${fmt(st.iPaid)} ब्याज</small></div><div class="stat"><small>शेष मूलधन</small><b>${fmt(st.pOut)}</b></div><div class="stat"><small>अतिदेय राशि</small><b style="color:${st.overdue>0?'var(--bad)':'inherit'}">${fmt(st.overdue)}</b></div><div class="stat"><small>अगली किस्त</small><b>${st.next?fmt(st.nextDue):'—'}</b><small>${st.next?fmtD(st.next.due):'ऋण चुकता'}</small></div></div>

/* collection */
VIEWS.collect=p=>{const a=p.id&&S.cache.apps[p.id];
  if(!a||!a.loan||a.loan.status!=='active'){const q=(p.q||'').toLowerCase();let list=loanList().filter(x=>x.loan.status==='active');if(q)list=list.filter(x=>(x.loan.loanNo+' '+x.form.name+' '+x.form.mobile+' '+x.form.memberId).toLowerCase().includes(q));
    return shell(ph('किस्त जमा','ऋण खाता चुनें')+`<div class="filters"><label class="fld"><span>ऋण खाता सं. / नाम / मोबाइल</span><input id="q" value="${esc(p.q||'')}" onkeydown="if(event.key==='Enter')A.go('collect',{q:this.value})"></label><button class="btn sm" onclick="A.go('collect',{q:$('#q').value})">खोजें</button></div>
    ${list.length?`<div class="tw"><table class="t"><thead><tr><th>ऋण खाता सं.</th><th>ऋणी</th><th>मोबाइल</th><th class="n">शेष मूलधन</th><th class="n">अतिदेय</th><th>अगली किस्त</th></tr></thead><tbody>${list.map(x=>{const st=loanStats(x.loan);return `<tr class="click ${st.overdue>0?'od':''}" onclick="A.go('collect',{id:'${x.id}'})"><td><b>${esc(x.loan.loanNo)}</b></td><td>${esc(x.form.name)}</td><td>${esc(x.form.mobile)}</td><td class="n">${fmt(st.pOut)}</td><td class="n">${fmt(st.overdue)}</td><td>${st.next?fmtD(st.next.due)+' · '+fmt(st.nextDue):''}</td></tr>`}).join('')}</tbody></table></div>`:'<div class="note">कोई चालू ऋण खाता नहीं।</div>'}`)}
  const L=a.loan,st=loanStats(L);const def=st.overdue>0?st.overdue:st.nextDue;
  return shell(ph('किस्त जमा – '+esc(L.loanNo),esc(a.form.name)+' · सदस्य आईडी '+esc(a.form.memberId)+' · मो. '+esc(a.form.mobile),`<button class="btn ghost sm" onclick="A.go('collect')">← दूसरा खाता</button>`)+
  `<div class="detail"><div class="stack"><div class="stats"><div class="stat"><small>शेष मूलधन</small><b>${fmt(st.pOut)}</b></div><div class="stat"><small>अतिदेय राशि (आज तक)</small><b>${fmt(st.overdue)}</b></div><div class="stat"><small>अगली किस्त</small><b>${fmt(st.nextDue)}</b><small>${st.next?fmtD(st.next.due)+' · मूलधन '+fmt(st.next.prin-st.next.pPrin)+' + ब्याज '+fmt(st.next.int-st.next.pInt):''}</small></div><div class="stat"><small>पूर्ण चुकता हेतु कुल शेष (अनुसूची अनुसार)</small><b>${fmt(st.totalOut)}</b></div></div>
  <div class="note">जमा राशि पहले देय ब्याज में, फिर मूलधन में – किस्त क्रम से समायोजित होगी। रसीद में मूलधन और ब्याज अलग-अलग दर्शाए जाएंगे।</div></div>
  <div class="act"><h3>भुगतान प्रविष्टि</h3><label class="fld"><span>जमा दिनांक</span><input id="c_date" type="date" value="${today()}"></label><label class="fld"><span>राशि (₹)</span><input id="c_amt" type="number" min="1" step="0.01" value="${def}"></label>
  <div class="prev" id="c_prev"></div>
  <label class="fld"><span>भुगतान माध्यम</span><select id="c_mode"><option>नकद</option><option>UPI</option><option>NEFT / IMPS</option><option>चेक</option></select></label><label class="fld"><span>लेन-देन संदर्भ सं.</span><input id="c_ref"></label>
  <button class="btn acc" onclick="A.collect('${a.id}')">जमा करें एवं रसीद बनाएं</button></div></div>`)};
AFTER.collect=p=>{const el=$('#c_amt');if(!el)return;const a=S.cache.apps[p.id];const up=()=>{const v=+el.value||0;const st=loanStats(a.loan);const al=allocate(a.loan,Math.min(v,st.totalOut));$('#c_prev').innerHTML=`<div><span>मूलधन में</span><b>${fmt(al.P)}</b></div><div><span>ब्याज में</span><b>${fmt(al.I)}</b></div><div><span>जमा के बाद शेष मूलधन</span><b>${fmt(st.pOut-al.P)}</b></div>${v>st.totalOut+0.004?`<div style="color:var(--bad)"><span>अधिकतम जमा योग्य</span><b>${fmt(st.totalOut)}</b></div>`:''}`;trDom($('#c_prev'))};el.addEventListener('input',up);up()};

VIEWS.receipts=p=>{const q=(p.q||'').toLowerCase();let list=Object.values(S.cache.entries).filter(e=>e.kind==='receipt');if(q)list=list.filter(e=>(e.vno+' '+e.party+' '+e.loanNo).toLowerCase().includes(q));list.sort((a,b)=>(b.at||'').localeCompare(a.at||''));
  return shell(ph('रसीदें','सभी किस्त प्राप्ति रसीदें – पुनः प्रिंट हेतु')+`<div class="filters"><label class="fld"><span>खोजें</span><input id="q" value="${esc(p.q||'')}" onkeydown="if(event.key==='Enter')A.go('receipts',{q:this.value})"></label><button class="btn sm" onclick="A.go('receipts',{q:$('#q').value})">खोजें</button></div>

/* books */
function sortedEntries(){return Object.values(S.cache.entries).sort((a,b)=>a.date===b.date?(a.at||'').localeCompare(b.at||''):a.date.localeCompare(b.date))}
const monthStart=()=>today().slice(0,8)+'01';
function rangeBar(v,p,extra){return `<div class="filters">${extra||''}<label class="fld"><span>दिनांक से</span><input type="date" id="r_from" value="${p.from||monthStart()}"></label><label class="fld"><span>दिनांक तक</span><input type="date" id="r_to" value="${p.to||today()}"></label><button class="btn sm" onclick="A.go('${v}',Object.assign({},A.R().p,{from:$('#r_from').value,to:$('#r_to').value${v==='ledger'?",acct:$('#r_acct').value":''}}))">दिखाएं</button></div>`}
const balTxt=b=>Math.abs(b)<0.005?fmt(0):fmt(Math.abs(b))+(b>0?' नामे':' जमा');
VIEWS.ledger=p=>{const acct=p.acct||'LOAN',from=p.from||monthStart(),to=p.to||today();const all=sortedEntries();let open=0,rows=[];
  for(const e of all)for(const l of e.lines){if(l.a!==acct)continue;if(e.date<from)open+=l.dr-l.cr;else if(e.date<=to)rows.push({e,l})}
  let bal=r2(open),tdr=0,tcr=0;
  return shell(ph('लेजर','खाता-वार नामे / जमा प्रविष्टियाँ – वितरण एवं किस्त जमा से स्वतः')+rangeBar('ledger',p,`<label class="fld"><span>खाता</span><select id="r_acct">${Object.keys(ACC).map(k=>`<option value="${k}" ${k===acct?'selected':''}>${ACC[k]}</option>`).join('')}</select></label>`)+
  `<div class="tw"><table class="t"><thead><tr><th>दिनांक</th><th>वाउचर</th><th>पक्षकार</th><th>विवरण</th><th class="n">नामे (Dr)</th><th class="n">जमा (Cr)</th><th class="n">शेष</th></tr></thead><tbody><tr><td>${fmtD(from)}</td><td></td><td></td><td><b>प्रारंभिक शेष</b></td><td></td><td></td><td class="n">${balTxt(bal)}</td></tr>${rows.map(({e,l})=>{bal=r2(bal+l.dr-l.cr);tdr+=l.dr;tcr+=l.cr;return `<tr><td>${fmtD(e.date)}</td><td>${esc(e.vno)}</td><td>${esc(e.party)}</td><td>${esc(e.narration)}</td><td class="n">${l.dr?fmt(l.dr):''}</td><td class="n">${l.cr?fmt(l.cr):''}</td><td class="n">${balTxt(bal)}</td></tr>`}).join('')}</tbody><tfoot><tr><td colspan="4">योग / अंतिम शेष</td><td class="n">${fmt(tdr)}</td><td class="n">${fmt(tcr)}</td><td class="n">${balTxt(bal)}</td></tr></tfoot></table></div>`)};
VIEWS.cashbook=p=>{const from=p.from||monthStart(),to=p.to||today();let oc=0,ob=0;const rows=[];
  for(const e of sortedEntries()){const c=e.lines.find(l=>l.a==='CASH'),b=e.lines.find(l=>l.a==='BANK');if(!c&&!b)continue;
    if(e.date<from){if(c)oc+=c.dr-c.cr;if(b)ob+=b.dr-b.cr}else if(e.date<=to)rows.push({e,c,b})}
  let cb=r2(oc),bb=r2(ob),t=[0,0,0,0];

const normH=x=>String(x??'').toLowerCase().replace(/[\s.\-_\/()%:*|,]/g,'');
function matchHeaders(row){const m={};(row||[]).forEach((h,ci)=>{const parts=String(h??'').split('|').map(normH).filter(Boolean);if(!parts.length)return;
  for(const c of IMPORT_COLS){if(m[c[0]]!==undefined)continue;const al=[normH(c[1]),normH(c[2]),...c[4].map(normH)];if(parts.some(p=>al.includes(p))){m[c[0]]=ci;break}}});return m}
function impNum(v){if(typeof v==='number')return v;const t=String(v??'').replace(/[₹,\s]/g,'');if(t==='')return 0;const n=Number(t);return isNaN(n)?NaN:n}
function impDate(v){if(v===''||v==null)return '';
  if(v instanceof Date&&!isNaN(v)){return iso(new Date(v.getTime()+12*3600e3))}
  if(typeof v==='number'&&window.XLSX){const d=XLSX.SSF.parse_date_code(v);if(d&&d.y)return d.y+'-'+String(d.m).padStart(2,'0')+'-'+String(d.d).padStart(2,'0')}
  const t=String(v).trim();let m=t.match(/^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{2,4})$/);
  if(m){let y=+m[3];if(y<100)y+=2000;const dd=+m[1],mm=+m[2];if(mm<1||mm>12||dd<1||dd>31)return '';return y+'-'+String(mm).padStart(2,'0')+'-'+String(dd).padStart(2,'0')}
  m=t.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);if(m)return m[1]+'-'+m[2].padStart(2,'0')+'-'+m[3].padStart(2,'0');return ''}
function impProduct(x){const t=normH(x);if(!t)return '';if(/quarter|त्रैमासिक|तिमाही|¼/.test(t))return 'quarterly';if(/bullet|वर्षांत|वार्षिक|yearend|सालाना|एकमुश्त/.test(t))return 'bullet';if(/emi|ईएमआई|समानमासिक/.test(t))return 'emi';

    amount:r2(impNum(g('amount'))),rate:impNum(g('rate')),tenure:Math.round(impNum(g('tenure'))),method:impProduct(sv('product')),paidP:r2(impNum(g('paidP'))),paidI:r2(impNum(g('paidI')))};
  const row={line,f};const E=m=>{row.err=m;return row};
  if(!f.name)return E('नाम खाली है');if(!f.memberId)return E('सदस्य आईडी खाली है');
  if(!f.disbDate)return E('वितरण दिनांक गलत है');if(f.disbDate>today())return E('वितरण दिनांक भविष्य की है');
  if(!(f.amount>0))return E('ऋण राशि गलत है');if(sv('rate')===''||!(f.rate>=0))return E('ब्याज दर गलत है');if(!(f.tenure>0&&f.tenure<=120))return E('अवधि गलत है');

     log(app,'किस्त जमा',`${rno} – ${fmt(amount)} (मूलधन ${fmt(al.P)}, ब्याज ${fmt(al.I)})`+(app.status==='closed'?' – ऋण पूर्ण चुकता':''));await put('apps',id,app);busy(false);
