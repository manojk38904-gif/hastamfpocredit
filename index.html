<body>
<title>हस्तम सदस्य ऋण</title>

<style>
/* Layout: landing = two doors; staff = side rail + work area; documents = A4 paper sheets */
:root{
  --bg:#f2f4ef; --surface:#ffffff; --surface2:#e8ece3; --ink:#18241d; --muted:#5b6b60; --line:#d3dacd;
  --brand:#1f5b40; --brand-ink:#ffffff; --brand-soft:#dcebe2; --accent:#a8700c; --accent-soft:#f6ead2;
  --ok:#1d7745; --ok-soft:#dcf0e3; --warn:#9a5c00; --warn-soft:#fbecd2; --bad:#b3261e; --bad-soft:#f9dedb; --info:#22598a; --info-soft:#dde9f5;
  --f-body:"Mukta","Noto Sans Devanagari","Nirmala UI",system-ui,sans-serif;
  --f-disp:"Tiro Devanagari Hindi","Mukta",Georgia,serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1512; --surface:#16201b; --surface2:#1d2a23; --ink:#e3ebe5; --muted:#9db0a3; --line:#2c3b33;
  --brand:#62c08f; --brand-ink:#07130c; --brand-soft:#1f3a2d; --accent:#e2aa45; --accent-soft:#3a2d14;
  --ok:#66d196; --ok-soft:#173326; --warn:#eaa955; --warn-soft:#3a2a12; --bad:#f07f76; --bad-soft:#3d1c1a; --info:#82b8e6; --info-soft:#18293a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1512; --surface:#16201b; --surface2:#1d2a23; --ink:#e3ebe5; --muted:#9db0a3; --line:#2c3b33;
  --brand:#62c08f; --brand-ink:#07130c; --brand-soft:#1f3a2d; --accent:#e2aa45; --accent-soft:#3a2d14;
  --ok:#66d196; --ok-soft:#173326; --warn:#eaa955; --warn-soft:#3a2a12; --bad:#f07f76; --bad-soft:#3d1c1a; --info:#82b8e6; --info-soft:#18293a; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
h1,h2,h3{text-wrap:balance;margin:0;line-height:1.25}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:1100px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.num,td.n,th.n{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--brand);background:var(--brand);color:var(--brand-ink);padding:9px 16px;border-radius:8px;cursor:pointer;font-weight:600;white-space:nowrap;text-decoration:none}
.btn:hover{filter:brightness(1.07)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--brand)}
.btn.warn{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.acc{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.sm{padding:5px 11px;font-size:13.5px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.pill{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12.5px;font-weight:600;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}.pill.warn{background:var(--warn-soft);color:var(--warn)}.pill.bad{background:var(--bad-soft);color:var(--bad)}.pill.info{background:var(--info-soft);color:var(--info)}.pill.muted{background:var(--surface2);color:var(--muted)}
.req{color:var(--bad);font-style:normal}
/* landing */
.land-h{background:var(--brand);color:var(--brand-ink);padding-block:34px 30px}
.land-h .wrap{display:flex;gap:18px;align-items:center}
.seal{flex:none;width:64px;height:64px;border-radius:50%;border:2px solid currentColor;display:grid;place-items:center;font-family:var(--f-disp);font-size:32px}
.seal.sm{width:38px;height:38px;font-size:19px;border-width:1.5px}
.eyebrow{font-size:13px;letter-spacing:.06em;opacity:.85}
.land-h h1{font-family:var(--f-disp);font-weight:400;font-size:clamp(24px,4.4vw,38px)}
.land-h .en{margin:4px 0 0;font-size:13px;letter-spacing:.08em;opacity:.85}
.land-main{padding-block:34px 48px}
.lede{font-size:18px;margin:0 0 22px;max-width:60ch}
.doors{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px}
.door{display:flex;flex-direction:column;align-items:flex-start;gap:10px;text-align:left;padding:26px;border-radius:14px;border:1px solid var(--line);background:var(--surface);cursor:pointer;min-height:200px;transition:border-color .15s,transform .15s}
.door:hover{border-color:var(--brand);transform:translateY(-2px)}
.door svg{width:44px;height:44px;color:var(--brand)}
.door.cust svg{color:var(--accent)}
.door b{font-size:22px;font-family:var(--f-disp);font-weight:400}
.door span{color:var(--muted)}
.door .go{margin-top:auto;font-weight:600;color:var(--brand)}
.door.cust .go{color:var(--accent)}
.addr{margin-top:28px;font-size:13px;color:var(--muted)}
/* auth */
.auth{max-width:420px;margin:48px auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.auth h2{font-family:var(--f-disp);font-weight:400;font-size:26px;margin-bottom:4px}
.stack{display:flex;flex-direction:column;gap:12px}
/* forms */
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld>span{font-size:13.5px;font-weight:600;color:var(--muted)}
.fld.full{grid-column:1/-1}
input,select,textarea{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:var(--surface);min-width:0}
input[readonly]{background:var(--surface2)}
textarea{resize:vertical}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px 14px}
.sec{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:14px}
.sec>h3{font-size:17px;color:var(--brand)}
.radios{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.radio{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:8px;padding:10px;cursor:pointer}
.radio input{width:auto;margin-top:5px}
.radio span{display:flex;flex-direction:column}
.radio small{color:var(--muted)}
.radio:has(input:checked){border-color:var(--brand);background:var(--brand-soft)}
.check{display:flex;gap:10px;align-items:flex-start}
.check input{width:auto;margin-top:5px}
/* customer */
.cust-top{background:var(--surface);border-bottom:1px solid var(--line);padding-block:12px}
.cust-top .wrap{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.steps{display:flex;gap:6px;flex-wrap:wrap;margin:20px 0 6px}
.step{padding:6px 14px;border-radius:99px;background:var(--surface2);color:var(--muted);font-weight:600;font-size:14px}
.step.on{background:var(--brand);color:var(--brand-ink)}
.step.done{background:var(--brand-soft);color:var(--brand)}
.cust-body{display:flex;flex-direction:column;gap:16px;padding-block:10px 40px}
/* files */
.ftiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.ftile{border:1px dashed var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:10px;background:var(--surface)}
.ftile.has{border-style:solid;border-color:var(--brand)}
.ft-h{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}
.th{width:72px;height:72px;border-radius:8px;border:1px solid var(--line);background:var(--surface2) center/cover no-repeat;cursor:pointer;position:relative;padding:0}
.th.pdf::after{content:"PDF";position:absolute;inset:0;display:grid;place-items:center;font-weight:700;color:var(--bad)}
.th.miss::after{content:"?";position:absolute;inset:0;display:grid;place-items:center;color:var(--muted)}
.th .x{position:absolute;top:-7px;right:-7px;width:22px;height:22px;border-radius:50%;border:none;background:var(--bad);color:#fff;font-size:13px;line-height:22px;cursor:pointer;padding:0}
.ftile label.btn{align-self:flex-start}
/* shell */
.shell{display:grid;grid-template-columns:230px minmax(0,1fr);min-height:100vh}
.side{background:var(--surface);border-right:1px solid var(--line);padding:16px 12px;display:flex;flex-direction:column;gap:14px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;gap:10px;align-items:center;color:var(--brand);padding:0 6px}
.brand b{display:block;font-family:var(--f-disp);font-weight:400;font-size:18px;color:var(--ink)}
.brand small{color:var(--muted)}
.side nav{display:flex;flex-direction:column;gap:2px}
.nv{display:flex;justify-content:space-between;align-items:center;text-align:left;border:none;background:none;padding:8px 10px;border-radius:7px;cursor:pointer;font-weight:500}
.nv:hover{background:var(--surface2)}
.nv.on{background:var(--brand-soft);color:var(--brand);font-weight:700}
.nv i{font-style:normal;background:var(--accent);color:#fff;border-radius:99px;font-size:11.5px;padding:0 7px;font-weight:700}
.me{margin-top:auto;border-top:1px solid var(--line);padding:12px 6px 0;display:flex;flex-direction:column;gap:4px;align-items:flex-start}
.me small{color:var(--muted)}
.main{padding-block:22px 48px;padding-left:max(22px,env(safe-area-inset-left,0px));padding-right:max(22px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px;min-width:0}
.demo{background:var(--warn-soft);color:var(--warn);padding:8px 12px;border-radius:8px;font-size:13.5px}
.ph{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.ph h2{font-family:var(--f-disp);font-weight:400;font-size:28px}
.ph p{margin:2px 0 0;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.stat small{color:var(--muted);display:block}
.stat b{font-size:22px;font-variant-numeric:tabular-nums}
.pipe{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
.pipe button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px;text-align:left;cursor:pointer}
.pipe button b{display:block;font-size:22px;font-variant-numeric:tabular-nums}
.pipe button small{color:var(--muted)}
.tw{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
table.t{width:100%;border-collapse:collapse;font-size:14px}
.t th{text-align:left;font-size:12.5px;letter-spacing:.03em;color:var(--muted);font-weight:600;background:var(--surface2);padding:8px 10px;white-space:nowrap}
.t td{padding:8px 10px;border-top:1px solid var(--line);vertical-align:top}
.t td.n,.t th.n{text-align:right;white-space:nowrap}
.t tr.click{cursor:pointer}
.t tr.click:hover td{background:var(--surface2)}
.t tr.paid td{color:var(--muted)}
.t tr.od td{background:var(--bad-soft)}
.t tfoot td{font-weight:700;background:var(--surface2)}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end}
.filters .fld{width:auto;min-width:150px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:4px 12px;cursor:pointer;font-size:13.5px}
.chip.on{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.detail{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:18px;align-items:start}
.dl{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px 16px;margin:0}
.dl div{min-width:0}
.dl dt{font-size:12.5px;color:var(--muted)}
.dl dd{margin:0;font-weight:500;overflow-wrap:anywhere}
.act{border:2px solid var(--accent);background:var(--surface);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;position:sticky;top:12px}
.act h3{color:var(--accent);font-size:17px}
.photo{width:110px;height:136px;border-radius:8px;border:1px solid var(--line);background:var(--surface2) center/cover no-repeat;flex:none}
.log{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.log li{border-left:3px solid var(--brand);padding-left:10px}
.log small{color:var(--muted);display:block}
.note{background:var(--info-soft);color:var(--info);padding:10px 12px;border-radius:8px;font-size:14px}
.note.w{background:var(--warn-soft);color:var(--warn)}
.note.b{background:var(--bad-soft);color:var(--bad)}
.prev{background:var(--surface2);border-radius:8px;padding:10px;font-size:14px;display:grid;gap:4px}
.prev div{display:flex;justify-content:space-between;gap:8px}
/* modal, toasts, busy */
#modal{position:fixed;inset:0;background:rgba(10,20,14,.55);z-index:50;display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:max(20px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 20px max(12px,env(safe-area-inset-left,0px))}
.mbox{background:var(--surface);border-radius:12px;width:min(520px,100%);padding:18px;display:flex;flex-direction:column;gap:12px}
.mbox.wide{width:min(900px,100%)}
.m-h{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.paperwrap{overflow:auto;background:var(--surface2);border-radius:8px;padding:12px;max-height:72vh}
.bigimg{max-width:100%;max-height:75vh;display:block;margin:0 auto;border-radius:6px}
#toasts{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:max(16px,env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px;z-index:60}
.toast{background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:8px;max-width:340px;box-shadow:0 6px 20px rgba(0,0,0,.2)}
.toast.bad{background:var(--bad);color:#fff}
#busy{position:fixed;inset:0;z-index:70;background:rgba(10,20,14,.35);display:grid;place-items:center}
#busy div{background:var(--surface);padding:14px 20px;border-radius:10px;font-weight:600}
.pwwrap{position:relative;display:block}
.pwwrap input{padding-right:84px}
.pwbtn{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:none;background:var(--surface2);color:var(--brand);font-weight:600;font-size:13px;padding:4px 10px;border-radius:6px;cursor:pointer}
.loading{padding:60px 16px;text-align:center;color:var(--muted)}
/* paper documents: fixed print colours by design */
.paper{width:794px;background:#fff;color:#141414;padding:34px 40px;font-family:"Mukta","Noto Sans Devanagari",sans-serif;font-size:12.5px;line-height:1.45;margin:0 auto}
.paper .p-head{text-align:center;border-bottom:2px solid #1f5b40;padding-bottom:8px;margin-bottom:10px}
.paper .p-co{font-weight:700;font-size:16px;letter-spacing:.04em;color:#1f5b40}
.paper .p-cohi{font-family:"Tiro Devanagari Hindi",serif;font-size:14px}
.paper .p-addr{font-size:10.5px;color:#444}
.paper .p-title{margin-top:6px;font-weight:700;font-size:15px;letter-spacing:.08em}
.paper .p-meta{display:flex;justify-content:space-between;gap:10px;font-size:12px;margin-bottom:8px}
.paper h4{margin:12px 0 4px;font-size:13px;background:#e9efe9;padding:4px 8px;color:#1f5b40}
.paper table{width:100%;border-collapse:collapse}
.paper td,.paper th{border:1px solid #9aa79f;padding:4px 7px;vertical-align:top;text-align:left}
.paper th{background:#f1f4f1;font-weight:600}
.paper td.k{width:38%;color:#333;background:#fafbfa}
.paper td.n,.paper th.n{text-align:right;font-variant-numeric:tabular-nums}
.paper tr.hl td{background:#fdf1d6;font-weight:600}
.paper .p-photo{width:110px;height:136px;border:1px solid #777;object-fit:cover;display:block}
.paper .p-photo.empty{display:grid;place-items:center;color:#777;font-size:11px}
.paper .sigs{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:40px}
.paper .sigs div{border-top:1px solid #333;padding-top:4px;text-align:center;font-size:11.5px}
.paper p{margin:6px 0}
.paper .small{font-size:11px;color:#444}
.pdfhost{position:absolute;left:-12000px;top:0}
@media (max-width:860px){
  .shell{grid-template-columns:1fr}
  .side{position:static;height:auto;border-right:none;border-bottom:1px solid var(--line);padding:10px 12px;gap:8px}
  .side nav{flex-direction:row;overflow-x:auto;gap:4px;padding-bottom:4px}
  .nv{white-space:nowrap;gap:6px}
  .me{flex-direction:row;align-items:center;gap:10px;border-top:none;padding:0 6px;margin:0;flex-wrap:wrap}
  .detail{grid-template-columns:1fr}
  .act{position:static}
  .main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<script>
"use strict";
/* ============ utilities ============ */
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const r2=n=>Math.round(((+n)||0)*100)/100;
const fmt=n=>'₹'+r2(n).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});
const fmtD=d=>d?String(d).slice(0,10).split('-').reverse().join('-'):'';
const fmtDT=iso=>{try{return new Date(iso).toLocaleString('en-IN',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'})}catch(e){return iso}};
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const today=()=>iso(new Date());
const nowISO=()=>new Date().toISOString();
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const pad=n=>String(n).padStart(4,'0');
const clone=o=>JSON.parse(JSON.stringify(o));
function addMonths(s,m){const [y,mo,d]=s.split('-').map(Number);const t=new Date(y,mo-1+m,1);const last=new Date(t.getFullYear(),t.getMonth()+1,0).getDate();t.setDate(Math.min(d,last));return iso(t)}
function fyCode(s){const [y,m]=s.split('-').map(Number);const st=m>=4?y:y-1;return String(st%100).padStart(2,'0')+String((st+1)%100).padStart(2,'0')}
function inWords(num){num=Math.round(+num||0);if(!num)return 'Rupees Zero Only';
  const a=['','One','Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten','Eleven','Twelve','Thirteen','Fourteen','Fifteen','Sixteen','Seventeen','Eighteen','Nineteen'];
  const b=['','','Twenty','Thirty','Forty','Fifty','Sixty','Seventy','Eighty','Ninety'];
  const two=n=>n<20?a[n]:b[Math.floor(n/10)]+(n%10?' '+a[n%10]:'');
  const three=n=>(n>=100?a[Math.floor(n/100)]+' Hundred'+(n%100?' ':''):'')+(n%100?two(n%100):'');

function genSchedule(P,rate,n,method,start){P=r2(P);n=+n;const r=(+rate)/1200;const rows=[];let bal=P;
  if(method==='emi'){const emi=r?Math.round(P*r*Math.pow(1+r,n)/(Math.pow(1+r,n)-1)):Math.round(P/n);
    for(let i=1;i<=n;i++){const it=r2(bal*r);let pr=r2(emi-it);if(i===n||pr>bal)pr=bal;const open=bal;bal=r2(bal-pr);rows.push({n:i,due:addMonths(start,i),open,int:it,prin:pr,bal})}}
  else if(method==='bullet'){for(let i=1;i<=n;i++){const it=r2(P*r);const pr=i===n?P:0;const open=bal;bal=r2(bal-pr);rows.push({n:i,due:addMonths(start,i),open,int:it,prin:pr,bal})}}
  else{const q=Math.ceil(n/3);const qp=r2(P/q);for(let i=1;i<=n;i++){const it=r2(bal*r);let pr=0;if(i%3===0||i===n)pr=(i===n)?bal:Math.min(qp,bal);const open=bal;bal=r2(bal-pr);rows.push({n:i,due:addMonths(start,i),open,int:it,prin:pr,bal})}}

<div class="doors"><button class="door" onclick="A.go('${u?'dash':'login'}')">${IC.staff}<b>एफपीओ स्टाफ एवं एडमिन लॉगिन</b><span>एडमिन, सब-एडमिन, शाखा प्रबंधक एवं लेखाकार के लिए</span><span class="go">${u?esc(u.name)+' – डैशबोर्ड खोलें →':'लॉगिन करें →'}</span></button>
<button class="door cust" onclick="A.startApply()">${IC.cust}<b>ग्राहक ऋण आवेदन</b><span>आवेदन फॉर्म भरें, आधार, पैन एवं फोटो अपलोड करें और जमा करें</span><span class="go">आवेदन शुरू करें →</span></button></div>
${S.mode==='local'&&!window.claude?'<div class="note b" style="margin-top:20px">ऑनलाइन डेटाबेस जुड़ा नहीं है – अभी डेटा केवल इसी ब्राउज़र में सहेजा जाएगा, दूसरे मोबाइल/कंप्यूटर पर नहीं दिखेगा।</div>':''}<p class="addr">शाखा: ${esc(s.address)}</p></main></div>`};
VIEWS.login=()=>{const hasAdmin=S.mode==='fb'?!!(S.cache.config&&S.cache.config.setup):Object.values(S.cache.users).some(u=>u.role==='admin'&&u.active!==false);
  if(!hasAdmin)return `<div class="auth"><div class="card stack"><h2>पहला एडमिन खाता बनाएं</h2><p class="muted">सिस्टम में अभी कोई उपयोगकर्ता नहीं है। एडमिन खाता बनाने के बाद एडमिन अन्य स्टाफ (सब-एडमिन, शाखा प्रबंधक, लेखाकार) जोड़ सकेगा।</p>
  <label class="fld"><span>नाम</span><input id="su_name"></label><label class="fld"><span>यूज़रनेम</span><input id="su_user" autocomplete="off"></label><label class="fld"><span>पासवर्ड (कम से कम 6 अक्षर)</span><input id="su_pw" type="password"></label>
  <button class="btn" onclick="A.setupAdmin()">एडमिन खाता बनाएं</button><button class="btn ghost" onclick="A.go('landing')">← वापस</button></div></div>`;
  return `<div class="auth"><form class="card stack" onsubmit="event.preventDefault();A.login()"><h2>स्टाफ लॉगिन</h2><p class="muted">एफपीओ स्टाफ एवं एडमिन</p>
  <label class="fld"><span>यूज़रनेम</span><input id="l_user" autocomplete="username"></label><label class="fld"><span>पासवर्ड</span><input id="l_pw" type="password" autocomplete="current-password"></label>
  <button class="btn" type="submit">लॉगिन करें</button><button class="btn ghost" type="button" onclick="A.go('landing')">← मुख्य पृष्ठ</button></form></div>`};

/* ============ views: customer application ============ */
function fieldHtml(f,v){const id='f_'+f.id;const lab=`<span>${f.l}${f.req?' <i class="req">*</i>':''}</span>`;let inp;
  if(v===undefined||v===null)v=f.def||'';
  if(f.t==='select')inp=`<select id="${id}"><option value="">— चुनें —</option>${f.opts.map(o=>`<option ${v===o?'selected':''}>${o}</option>`).join('')}</select>`;
  else if(f.t==='textarea')inp=`<textarea id="${id}" rows="2">${esc(v)}</textarea>`;
  else if(f.t==='product'){const P=SET().products;return `<div class="fld full">${lab}<div class="radios">${Object.keys(P).map(k=>`<label class="radio"><input type="radio" name="${id}" value="${k}" ${v===k?'checked':''} onchange="A.prodChange()"><span><b>${esc(P[k].name)}</b><small>${METHOD_DESC[k]}</small></span></label>`).join('')}</div></div>`}
  else if(f.t==='tenure')inp=`<select id="${id}">${[3,6,9,12,18,24,36].map(n=>`<option value="${n}" ${String(v||12)===String(n)?'selected':''}>${n} माह</option>`).join('')}</select>`;
  else{const ty={number:'number',date:'date',tel:'tel',email:'email'}[f.t]||'text';inp=`<input id="${id}" type="${ty}" value="${esc(v)}" ${f.ro?'readonly':''} ${ty==='number'?'min="0" step="any" inputmode="decimal"':''} ${f.pat==='pan'||f.pat==='ifsc'?'style="text-transform:uppercase"':''}>`}
  return `<label class="fld ${f.full?'full':''}">${lab}${inp}</label>`}
function readForm(){const o={};for(const s of SECTIONS)for(const f of s.f){if(f.t==='product'){const r=document.querySelector(`input[name="f_product"]:checked`);o.product=r?r.value:''}else{const el=$('#f_'+f.id);let v=el?el.value.trim():'';if(f.pat==='pan'||f.pat==='ifsc')v=v.toUpperCase();if(f.pat==='aadhaar'||f.pat==='mobile'||f.pat==='acc')v=v.replace(/\s|-/g,'');o[f.id]=v}}
  o.decl=$('#f_decl').checked;o.place=$('#f_place').value.trim();return o}
function validate(o){for(const s of SECTIONS)for(const f of s.f){const v=o[f.id];if(f.req&&!v)return `"${f.l}" भरना आवश्यक है`;if(v&&f.pat&&!PATS[f.pat][0].test(v))return `"${f.l}": ${PATS[f.pat][1]} दर्ज करें`}
  if(!(+o.amount>0))return 'ऋण राशि सही दर्ज करें';if(o.activity==='अन्य'&&!o.activityOther)return 'अन्य गतिविधि का विवरण लिखें';if(!o.place)return 'स्थान भरें';if(!o.decl)return 'घोषणा स्वीकार करें';return ''}
function stepsBar(n){const L=['आवेदन फॉर्म','आधार, पैन एवं फोटो','जाँचें एवं जमा करें'];return `<div class="steps">${L.map((l,i)=>`<span class="step ${i+1===n?'on':i+1<n?'done':''}">${i+1}. ${l}</span>`).join('')}</div>`}
VIEWS.apply=p=>{const s=SET();const appId=ss('cust');const app=appId&&S.cache.apps[appId];const step=p.step||1;
  const top=`<div class="cust-top"><div class="wrap"><div class="row"><div class="seal sm" style="color:var(--brand)">ह</div><div><b>${esc(s.companyHi)}</b><div class="muted" style="font-size:13px">सदस्य ऋण आवेदन · ${esc(s.branch)}</div></div></div><button class="btn sm ghost" onclick="A.go('landing')">मुख्य पृष्ठ</button></div></div>`;
  if(step==='done'&&app)return top+`<div class="wrap cust-body"><div class="sec"><h3>आपका आवेदन सफलतापूर्वक जमा हो गया</h3><p>आवेदन संख्या: <b style="font-size:20px">${esc(app.id)}</b></p><p class="muted">कृपया यह आवेदन संख्या सुरक्षित रखें। आपका आवेदन एडमिन को भेज दिया गया है। जाँच एवं सर्वे के बाद शाखा प्रबंधक आपसे संपर्क करेंगे।</p><div class="row"><button class="btn" onclick="A.showDoc('app','${app.id}')">आवेदन पत्र देखें / PDF</button><button class="btn ghost" onclick="A.newApply()">नया आवेदन</button></div></div></div>`;
  if(step===1){const f=(app&&app.status==='draft'&&app.form)||{};
    return top+`<div class="wrap">${stepsBar(1)}</div><form class="wrap cust-body" onsubmit="event.preventDefault();A.saveForm()">${app&&app.status==='draft'?`<div class="note">आवेदन संख्या ${esc(app.id)} – आप जानकारी बदल सकते हैं।</div>`:''}
    ${SECTIONS.map(sec=>`<section class="sec"><h3>${sec.t}</h3><div class="grid">${sec.f.map(x=>fieldHtml(x,f[x.id])).join('')}</div></section>`).join('')}
    <section class="sec"><h3>आवेदक घोषणा एवं सहमति</h3><label class="check"><input type="checkbox" id="f_decl" ${f.decl?'checked':''}><span>${DECL}</span></label><div class="grid"><label class="fld"><span>स्थान <i class="req">*</i></span><input id="f_place" value="${esc(f.place||'')}"></label></div></section>
    <div class="row"><button class="btn" type="submit">सहेजें और आगे बढ़ें →</button><span class="muted"><i class="req">*</i> वाले खाने भरना आवश्यक है</span></div></form>`}
  if(!app||app.status!=='draft')return top+`<div class="wrap cust-body"><div class="note w">पहले आवेदन फॉर्म भरें।</div><button class="btn" onclick="A.go('apply',{step:1})">फॉर्म भरें</button></div>`;
  if(step===2){const ok=CUST_DOCS.every(d=>!d[2]||((app.cdocs||{})[d[0]]||[]).length);
    return top+`<div class="wrap">${stepsBar(2)}</div><div class="wrap cust-body"><div class="note">आवेदन संख्या <b>${esc(app.id)}</b> सहेज ली गई है। अब नीचे दिए दस्तावेज़ों की स्पष्ट फोटो या PDF अपलोड करें।</div>
    <div class="ftiles">${CUST_DOCS.map(d=>fileTile(app,'cdocs',d[0],d[1],d[2],{accept:d[3]})).join('')}</div>
    <div class="row"><button class="btn ghost" onclick="A.go('apply',{step:1})">← फॉर्म बदलें</button><button class="btn" ${ok?'':'disabled'} onclick="A.go('apply',{step:3})">आगे बढ़ें →</button></div></div>`}
  return top+`<div class="wrap">${stepsBar(3)}</div><div class="wrap cust-body"><div class="note">कृपया अपना आवेदन जाँच लें। जमा करने के बाद इसमें बदलाव नहीं हो सकेगा।</div>
    <div class="paperwrap"><div class="paper" id="revDoc"><div class="muted">लोड हो रहा है…</div></div></div>
    <div class="row"><button class="btn ghost" onclick="A.go('apply',{step:2})">← दस्तावेज़</button><button class="btn ghost" onclick="A.go('apply',{step:1})">फॉर्म बदलें</button><button class="btn acc" onclick="A.submitApp()">आवेदन जमा करें</button></div></div>`};
AFTER.apply=async p=>{if((p.step||1)===1){const a=$('#f_amount'),w=$('#f_amountWords');if(a&&w){const up=()=>{w.value=+a.value>0?inWords(a.value):''};a.addEventListener('input',up);up()}A.prodChange()}
  if(p.step===3){const app=S.cache.apps[ss('cust')];if(app){const h=await docApplication(app);const el=$('#revDoc');if(el)el.innerHTML=h}}};

/* ============ views: staff ============ */
const NAV={admin:[['dash','डैशबोर्ड'],['apps','आवेदन'],['ready','वितरण हेतु तैयार'],['loans','ऋण खाते'],['collect','किस्त जमा'],['receipts','रसीदें'],['ledger','लेजर'],['cashbook','कैशबुक'],['users','उपयोगकर्ता'],['settings','उत्पाद एवं सेटिंग']],
  bm:[['dash','डैशबोर्ड'],['apps','मेरी फाइलें'],['ready','वितरण हेतु तैयार'],['loans','ऋण खाते'],['collect','किस्त जमा'],['receipts','रसीदें'],['ledger','लेजर'],['cashbook','कैशबुक']],
  accountant:[['dash','डैशबोर्ड'],['ready','वितरण हेतु तैयार'],['loans','ऋण खाते'],['collect','किस्त जमा'],['receipts','रसीदें'],['ledger','लेजर'],['cashbook','कैशबुक']]};
function myApps(){const u=CU();const all=Object.values(S.cache.apps);if(u.role==='admin')return all;if(isBM(u))return all.filter(a=>a.assignedTo===u.id||['ready','active','closed'].includes(a.status));return all.filter(a=>['ready','active','closed'].includes(a.status))}
function badge(v){const u=CU();let n=0;const apps=Object.values(S.cache.apps);
  if(v==='apps')n=u.role==='admin'?apps.filter(a=>a.status==='submitted').length:apps.filter(a=>a.assignedTo===u.id&&['forwarded','approved','sanctioned'].includes(a.status)).length;
  if(v==='ready')n=apps.filter(a=>a.status==='ready').length;return n?`<i>${n}</i>`:''}
function shell(body){const u=CU();const nav=NAV[u.role]||NAV.bm;const cur={app:'apps',loan:'loans'}[R.v]||R.v;
  return `<div class="shell"><aside class="side"><div class="brand"><div class="seal sm">ह</div><div><b>हस्तम FPO</b><small>${esc(SET().branch)} · ऋण</small></div></div>
  <nav>${nav.map(([v,l])=>`<button class="nv ${cur===v?'on':''}" onclick="A.go('${v}')">${l}${badge(v)}</button>`).join('')}</nav>
  <div class="me"><b>${esc(u.name)}</b><small>${ROLES[u.role]}</small><button class="btn sm ghost" onclick="A.logout()">लॉग आउट</button></div></aside>
  <main class="main">${S.mode==='local'?'<div class="demo">ऑफ़लाइन मोड: डेटा केवल इसी ब्राउज़र में सहेजा जा रहा है।</div>':''}${body}</main></div>`}
const ph=(t,sub,right)=>`<div class="ph"><div><h2>${t}</h2>${sub?`<p>${sub}</p>`:''}</div>${right||''}</div>`;
function appRows(list){if(!list.length)return '<div class="note">कोई आवेदन नहीं।</div>';
  return `<div class="tw"><table class="t"><thead><tr><th>आवेदन सं.</th><th>दिनांक</th><th>आवेदक</th><th>मोबाइल</th><th class="n">राशि</th><th>उत्पाद</th><th>स्थिति</th><th>प्रबंधक</th></tr></thead><tbody>${list.map(a=>`<tr class="click" onclick="A.go('app',{id:'${a.id}'})"><td><b>${esc(a.id)}</b></td><td>${fmtD(a.createdAt)}</td><td>${esc(a.form.name)}</td><td>${esc(a.form.mobile)}</td><td class="n">${fmt(a.form.amount)}</td><td>${esc((SET().products[a.form.product]||{}).name||'')}</td><td>${pill(a.status)}</td><td>${esc((S.cache.users[a.assignedTo]||{}).name||'—')}</td></tr>`).join('')}</tbody></table></div>`}
const byDateDesc=(a,b)=>(b.createdAt||'').localeCompare(a.createdAt||'');

VIEWS.dash=()=>{const u=CU();const apps=Object.values(S.cache.apps);const loans=apps.filter(a=>a.loan);const t=today();
  const ent=Object.values(S.cache.entries);const todayColl=ent.filter(e=>e.kind==='receipt'&&e.date===t).reduce((s,e)=>s+e.receipt.amount,0);
  let out=0,od=0,disb=0;loans.forEach(a=>{const st=loanStats(a.loan);disb+=a.loan.principal;if(a.loan.status==='active'){out+=st.pOut;if(st.overdue>0)od++}});
  const cnt=s=>myApps().filter(a=>a.status===s).length;const stages=u.role==='accountant'?['ready','active','closed']:['draft','submitted','forwarded','approved','sanctioned','ready','active','rejected'];
  const P=SET().products;const noRate=u.role==='admin'&&Object.values(P).some(p=>p.rate===''||p.rate===undefined);
  let todo='';if(u.role==='admin')todo=`<h3>फॉरवर्ड हेतु नए आवेदन</h3>`+appRows(apps.filter(a=>a.status==='submitted').sort(byDateDesc));
  else if(isBM(u))todo=`<h3>आपकी लंबित फाइलें</h3>`+appRows(apps.filter(a=>a.assignedTo===u.id&&['forwarded','approved','sanctioned'].includes(a.status)).sort(byDateDesc))+`<h3>वितरण हेतु तैयार (लेखाकार)</h3>`+appRows(apps.filter(a=>a.status==='ready'));
  else todo=`<h3>वितरण हेतु तैयार फाइलें</h3>`+appRows(apps.filter(a=>a.status==='ready'));
  return shell(ph('डैशबोर्ड',`नमस्ते ${esc(u.name)} · ${ROLES[u.role]} · ${fmtD(t)}`)+(noRate?`<div class="note w">उत्पादों की ब्याज दर सेट नहीं है। <button class="btn sm acc" onclick="A.go('settings')">उत्पाद सेट करें</button></div>`:'')+
  `<div class="stats"><div class="stat"><small>कुल वितरित ऋण</small><b>${fmt(disb)}</b></div><div class="stat"><small>बकाया मूलधन</small><b>${fmt(out)}</b></div><div class="stat"><small>आज की वसूली</small><b>${fmt(todayColl)}</b></div><div class="stat"><small>अतिदेय ऋण खाते</small><b>${od}</b></div></div>
  <div class="pipe">${stages.map(s=>`<button onclick="A.go(${s==='ready'?"'ready'":s==='active'||s==='closed'?"'loans'":`'apps',{st:'${s}'}`})"><b>${cnt(s)}</b><small>${ST[s][0]}</small></button>`).join('')}</div>${todo}`)};
VIEWS.apps=p=>{const u=CU();if(u.role==='accountant')return VIEWS.ready();const q=(p.q||'').toLowerCase();const st=p.st||'all';
  let list=myApps().sort(byDateDesc);if(st!=='all')list=list.filter(a=>a.status===st);if(q)list=list.filter(a=>(a.id+' '+a.form.name+' '+a.form.mobile+' '+a.form.memberId).toLowerCase().includes(q));
  const sts=['all','draft','submitted','forwarded','approved','sanctioned','ready','active','closed','rejected'];
  return shell(ph(u.role==='admin'?'सभी आवेदन':'मेरी फाइलें','आवेदन खोलने के लिए पंक्ति पर क्लिक करें')+`<div class="filters"><label class="fld"><span>खोजें (नाम / मोबाइल / आवेदन सं.)</span><input id="q" value="${esc(p.q||'')}" onkeydown="if(event.key==='Enter')A.go('apps',{st:'${st}',q:this.value})"></label><button class="btn sm" onclick="A.go('apps',{st:'${st}',q:$('#q').value})">खोजें</button></div>
  <div class="chips">${sts.map(s=>`<button class="chip ${st===s?'on':''}" onclick="A.go('apps',{st:'${s}'})">${s==='all'?'सभी':ST[s][0]}</button>`).join('')}</div>${appRows(list)}`)};
VIEWS.ready=()=>shell(ph('वितरण हेतु तैयार','हस्ताक्षरित स्वीकृति पत्र अपलोड हो चुका है – लेखाकार खाता संख्या जोड़कर वितरण करें')+appRows(Object.values(S.cache.apps).filter(a=>a.status==='ready').sort(byDateDesc)));

function infoBlock(app){const f=app.form;return SECTIONS.map(s=>{const items=s.f.filter(x=>f[x.id]!==''&&f[x.id]!==undefined&&x.id!=='amountWords');if(!items.length)return '';return `<section class="sec"><h3>${s.t}</h3><dl class="dl">${items.map(x=>`<div><dt>${x.l}</dt><dd>${fval(x,f[x.id])}</dd></div>`).join('')}</dl></section>`}).join('')}
function actionPanel(app){const u=CU();const s=app.status;const mine=u.role==='admin'||(isBM(u)&&app.assignedTo===u.id);const bms=Object.values(S.cache.users).filter(x=>x.active!==false&&(x.role==='bm'||x.role==='subadmin'));
  if(s==='draft')return `<div class="act"><h3>स्थिति</h3><p>ग्राहक ने अभी आवेदन जमा नहीं किया है (दस्तावेज़ अपलोड बाकी)।</p></div>`;
  if((s==='submitted'||s==='forwarded')&&u.role==='admin'&&(s==='submitted'||true)){const fw=`<div class="act"><h3>${s==='submitted'?'शाखा प्रबंधक / सब-एडमिन को फॉरवर्ड करें':'फाइल पुनः आवंटित करें'}</h3>${bms.length?`<label class="fld"><span>किसे भेजें</span><select id="fw_to">${bms.map(b=>`<option value="${b.id}" ${app.assignedTo===b.id?'selected':''}>${esc(b.name)} (${ROLES[b.role]})</option>`).join('')}</select></label><label class="fld"><span>टिप्पणी</span><textarea id="fw_note" rows="2"></textarea></label><button class="btn" onclick="A.forward('${app.id}')">फॉरवर्ड करें</button>`:`<div class="note w">पहले "उपयोगकर्ता" में शाखा प्रबंधक / सब-एडमिन जोड़ें।</div>`}</div>`;
    if(s==='submitted')return fw;return fw+surveyPanel(app)}

  `<div class="stats"><div class="stat"><small>वितरित मूलधन</small><b>${fmt(L.principal)}</b></div><div class="stat"><small>जमा मूलधन / ब्याज</small><b>${fmt(st.pPaid)}</b><small>${fmt(st.iPaid)} ब्याज</small></div><div class="stat"><small>शेष मूलधन</small><b>${fmt(st.pOut)}</b></div><div class="stat"><small>अतिदेय राशि</small><b style="color:${st.overdue>0?'var(--bad)':'inherit'}">${fmt(st.overdue)}</b></div><div class="stat"><small>अगली किस्त</small><b>${st.next?fmt(st.nextDue):'—'}</b><small>${st.next?fmtD(st.next.due):'ऋण चुकता'}</small></div></div>

/* collection */
VIEWS.collect=p=>{const a=p.id&&S.cache.apps[p.id];
  if(!a||!a.loan||a.loan.status!=='active'){const q=(p.q||'').toLowerCase();let list=loanList().filter(x=>x.loan.status==='active');if(q)list=list.filter(x=>(x.loan.loanNo+' '+x.form.name+' '+x.form.mobile+' '+x.form.memberId).toLowerCase().includes(q));
    return shell(ph('किस्त जमा','ऋण खाता चुनें')+`<div class="filters"><label class="fld"><span>ऋण खाता सं. / नाम / मोबाइल</span><input id="q" value="${esc(p.q||'')}" onkeydown="if(event.key==='Enter')A.go('collect',{q:this.value})"></label><button class="btn sm" onclick="A.go('collect',{q:$('#q').value})">खोजें</button></div>
    ${list.length?`<div class="tw"><table class="t"><thead><tr><th>ऋण खाता सं.</th><th>ऋणी</th><th>मोबाइल</th><th class="n">शेष मूलधन</th><th class="n">अतिदेय</th><th>अगली किस्त</th></tr></thead><tbody>${list.map(x=>{const st=loanStats(x.loan);return `<tr class="click ${st.overdue>0?'od':''}" onclick="A.go('collect',{id:'${x.id}'})"><td><b>${esc(x.loan.loanNo)}</b></td><td>${esc(x.form.name)}</td><td>${esc(x.form.mobile)}</td><td class="n">${fmt(st.pOut)}</td><td class="n">${fmt(st.overdue)}</td><td>${st.next?fmtD(st.next.due)+' · '+fmt(st.nextDue):''}</td></tr>`}).join('')}</tbody></table></div>`:'<div class="note">कोई चालू ऋण खाता नहीं।</div>'}`)}
  const L=a.loan,st=loanStats(L);const def=st.overdue>0?st.overdue:st.nextDue;
  return shell(ph('किस्त जमा – '+esc(L.loanNo),esc(a.form.name)+' · सदस्य आईडी '+esc(a.form.memberId)+' · मो. '+esc(a.form.mobile),`<button class="btn ghost sm" onclick="A.go('collect')">← दूसरा खाता</button>`)+
  `<div class="detail"><div class="stack"><div class="stats"><div class="stat"><small>शेष मूलधन</small><b>${fmt(st.pOut)}</b></div><div class="stat"><small>अतिदेय राशि (आज तक)</small><b>${fmt(st.overdue)}</b></div><div class="stat"><small>अगली किस्त</small><b>${fmt(st.nextDue)}</b><small>${st.next?fmtD(st.next.due)+' · मूलधन '+fmt(st.next.prin-st.next.pPrin)+' + ब्याज '+fmt(st.next.int-st.next.pInt):''}</small></div><div class="stat"><small>पूर्ण चुकता हेतु कुल शेष (अनुसूची अनुसार)</small><b>${fmt(st.totalOut)}</b></div></div>
  <div class="note">जमा राशि पहले देय ब्याज में, फिर मूलधन में – किस्त क्रम से समायोजित होगी। रसीद में मूलधन और ब्याज अलग-अलग दर्शाए जाएंगे।</div></div>
  <div class="act"><h3>भुगतान प्रविष्टि</h3><label class="fld"><span>जमा दिनांक</span><input id="c_date" type="date" value="${today()}"></label><label class="fld"><span>राशि (₹)</span><input id="c_amt" type="number" min="1" step="0.01" value="${def}"></label>
  <div class="prev" id="c_prev"></div>
  <label class="fld"><span>भुगतान माध्यम</span><select id="c_mode"><option>नकद</option><option>UPI</option><option>NEFT / IMPS</option><option>चेक</option></select></label><label class="fld"><span>लेन-देन संदर्भ सं.</span><input id="c_ref"></label>
  <button class="btn acc" onclick="A.collect('${a.id}')">जमा करें एवं रसीद बनाएं</button></div></div>`)};
AFTER.collect=p=>{const el=$('#c_amt');if(!el)return;const a=S.cache.apps[p.id];const up=()=>{const v=+el.value||0;const st=loanStats(a.loan);const al=allocate(a.loan,Math.min(v,st.totalOut));$('#c_prev').innerHTML=`<div><span>मूलधन में</span><b>${fmt(al.P)}</b></div><div><span>ब्याज में</span><b>${fmt(al.I)}</b></div><div><span>जमा के बाद शेष मूलधन</span><b>${fmt(st.pOut-al.P)}</b></div>${v>st.totalOut+0.004?`<div style="color:var(--bad)"><span>अधिकतम जमा योग्य</span><b>${fmt(st.totalOut)}</b></div>`:''}`};el.addEventListener('input',up);up()};

VIEWS.receipts=p=>{const q=(p.q||'').toLowerCase();let list=Object.values(S.cache.entries).filter(e=>e.kind==='receipt');if(q)list=list.filter(e=>(e.vno+' '+e.party+' '+e.loanNo).toLowerCase().includes(q));list.sort((a,b)=>(b.at||'').localeCompare(a.at||''));
  return shell(ph('रसीदें','सभी किस्त प्राप्ति रसीदें – पुनः प्रिंट हेतु')+`<div class="filters"><label class="fld"><span>खोजें</span><input id="q" value="${esc(p.q||'')}" onkeydown="if(event.key==='Enter')A.go('receipts',{q:this.value})"></label><button class="btn sm" onclick="A.go('receipts',{q:$('#q').value})">खोजें</button></div>
  ${list.length?`<div class="tw"><table class="t"><thead><tr><th>रसीद सं.</th><th>दिनांक</th><th>ऋण खाता</th><th>ऋणी</th><th>माध्यम</th><th class="n">राशि</th><th class="n">मूलधन</th><th class="n">ब्याज</th><th></th></tr></thead><tbody>${list.map(e=>{const r=e.receipt;return `<tr><td><b>${esc(r.rno)}</b></td><td>${fmtD(r.date)}</td><td>${esc(r.loanNo)}</td><td>${esc(r.name)}</td><td>${esc(r.mode)}</td><td class="n">${fmt(r.amount)}</td><td class="n">${fmt(r.P)}</td><td class="n">${fmt(r.I)}</td><td><button class="btn sm ghost" onclick="A.showDoc('receipt','${e.id}')">रसीद / PDF</button></td></tr>`}).join('')}</tbody></table></div>`:'<div class="note">अभी कोई रसीद नहीं।</div>'}`)};

/* books */
function sortedEntries(){return Object.values(S.cache.entries).sort((a,b)=>a.date===b.date?(a.at||'').localeCompare(b.at||''):a.date.localeCompare(b.date))}
const monthStart=()=>today().slice(0,8)+'01';
function rangeBar(v,p,extra){return `<div class="filters">${extra||''}<label class="fld"><span>दिनांक से</span><input type="date" id="r_from" value="${p.from||monthStart()}"></label><label class="fld"><span>दिनांक तक</span><input type="date" id="r_to" value="${p.to||today()}"></label><button class="btn sm" onclick="A.go('${v}',Object.assign({},A.R().p,{from:$('#r_from').value,to:$('#r_to').value${v==='ledger'?",acct:$('#r_acct').value":''}}))">दिखाएं</button></div>`}
const balTxt=b=>Math.abs(b)<0.005?fmt(0):fmt(Math.abs(b))+(b>0?' नामे':' जमा');
VIEWS.ledger=p=>{const acct=p.acct||'LOAN',from=p.from||monthStart(),to=p.to||today();const all=sortedEntries();let open=0,rows=[];
  for(const e of all)for(const l of e.lines){if(l.a!==acct)continue;if(e.date<from)open+=l.dr-l.cr;else if(e.date<=to)rows.push({e,l})}
  let bal=r2(open),tdr=0,tcr=0;
  return shell(ph('लेजर','खाता-वार नामे / जमा प्रविष्टियाँ – वितरण एवं किस्त जमा से स्वतः')+rangeBar('ledger',p,`<label class="fld"><span>खाता</span><select id="r_acct">${Object.keys(ACC).map(k=>`<option value="${k}" ${k===acct?'selected':''}>${ACC[k]}</option>`).join('')}</select></label>`)+
  `<div class="tw"><table class="t"><thead><tr><th>दिनांक</th><th>वाउचर</th><th>पक्षकार</th><th>विवरण</th><th class="n">नामे (Dr)</th><th class="n">जमा (Cr)</th><th class="n">शेष</th></tr></thead><tbody><tr><td>${fmtD(from)}</td><td></td><td></td><td><b>प्रारंभिक शेष</b></td><td></td><td></td><td class="n">${balTxt(bal)}</td></tr>${rows.map(({e,l})=>{bal=r2(bal+l.dr-l.cr);tdr+=l.dr;tcr+=l.cr;return `<tr><td>${fmtD(e.date)}</td><td>${esc(e.vno)}</td><td>${esc(e.party)}</td><td>${esc(e.narration)}</td><td class="n">${l.dr?fmt(l.dr):''}</td><td class="n">${l.cr?fmt(l.cr):''}</td><td class="n">${balTxt(bal)}</td></tr>`}).join('')}</tbody><tfoot><tr><td colspan="4">योग / अंतिम शेष</td><td class="n">${fmt(tdr)}</td><td class="n">${fmt(tcr)}</td><td class="n">${balTxt(bal)}</td></tr></tfoot></table></div>`)};
VIEWS.cashbook=p=>{const from=p.from||monthStart(),to=p.to||today();let oc=0,ob=0;const rows=[];
  for(const e of sortedEntries()){const c=e.lines.find(l=>l.a==='CASH'),b=e.lines.find(l=>l.a==='BANK');if(!c&&!b)continue;
    if(e.date<from){if(c)oc+=c.dr-c.cr;if(b)ob+=b.dr-b.cr}else if(e.date<=to)rows.push({e,c,b})}
  let cb=r2(oc),bb=r2(ob),t=[0,0,0,0];
  return shell(ph('कैशबुक','नकद एवं बैंक – प्राप्ति (Receipts) व भुगतान (Payments)')+rangeBar('cashbook',p)+
  `<div class="tw"><table class="t"><thead><tr><th>दिनांक</th><th>वाउचर / रसीद</th><th>पक्षकार</th><th>विवरण</th><th class="n">प्राप्ति – नकद</th><th class="n">प्राप्ति – बैंक</th><th class="n">भुगतान – नकद</th><th class="n">भुगतान – बैंक</th><th class="n">शेष नकद</th><th class="n">शेष बैंक</th></tr></thead><tbody><tr><td>${fmtD(from)}</td><td></td><td></td><td><b>प्रारंभिक शेष</b></td><td></td><td></td><td></td><td></td><td class="n">${fmt(cb)}</td><td class="n">${fmt(bb)}</td></tr>
  ${rows.map(({e,c,b})=>{const v=[c?c.dr:0,b?b.dr:0,c?c.cr:0,b?b.cr:0];v.forEach((x,i)=>t[i]+=x);cb=r2(cb+v[0]-v[2]);bb=r2(bb+v[1]-v[3]);return `<tr><td>${fmtD(e.date)}</td><td>${esc(e.vno)}</td><td>${esc(e.party)}</td><td>${esc(e.narration)}</td>${v.map(x=>`<td class="n">${x?fmt(x):''}</td>`).join('')}<td class="n">${fmt(cb)}</td><td class="n">${fmt(bb)}</td></tr>`}).join('')}</tbody>
  <tfoot><tr><td colspan="4">योग / अंतिम शेष</td>${t.map(x=>`<td class="n">${fmt(x)}</td>`).join('')}<td class="n">${fmt(cb)}</td><td class="n">${fmt(bb)}</td></tr></tfoot></table></div>`)};

/* admin */
VIEWS.users=()=>{if(CU().role!=='admin')return shell('<div class="note b">केवल एडमिन</div>');const us=Object.values(S.cache.users).sort((a,b)=>(a.name||'').localeCompare(b.name||''));
  return shell(ph('उपयोगकर्ता','स्टाफ लॉगिन बनाएं एवं प्रबंधित करें')+`<div class="tw"><table class="t"><thead><tr><th>नाम</th><th>यूज़रनेम</th><th>भूमिका</th><th>स्थिति</th><th></th></tr></thead><tbody>${us.map(u=>`<tr><td>${esc(u.name)}</td><td>${esc(u.username)}</td><td>${ROLES[u.role]}</td><td>${u.active===false?'<span class="pill bad">निष्क्रिय</span>':'<span class="pill ok">सक्रिय</span>'}</td><td><div class="row">${S.mode!=='fb'||u.id===CU().id?`<button class="btn sm ghost" onclick="A.resetPw('${u.id}')">पासवर्ड बदलें</button>`:''}${u.id!==CU().id?`<button class="btn sm ghost" onclick="A.toggleUser('${u.id}')">${u.active===false?'सक्रिय करें':'निष्क्रिय करें'}</button>`:''}</div></td></tr>`).join('')}</tbody></table></div>
  ${S.mode==='fb'?'<div class="note">कोई स्टाफ पासवर्ड भूल जाए तो उसका खाता निष्क्रिय करके नए यूज़रनेम से नया खाता बनाएं। हर व्यक्ति लॉगिन करके अपना पासवर्ड स्वयं बदल सकता है।</div>':''}<section class="sec"><h3>नया उपयोगकर्ता जोड़ें</h3><div class="grid"><label class="fld"><span>नाम</span><input id="u_name"></label><label class="fld"><span>यूज़रनेम</span><input id="u_user" autocomplete="off"></label><label class="fld"><span>पासवर्ड</span><input id="u_pw" type="password" autocomplete="new-password"></label><label class="fld"><span>भूमिका</span><select id="u_role">${Object.keys(ROLES).map(r=>`<option value="${r}">${ROLES[r]}</option>`).join('')}</select></label></div><div><button class="btn" onclick="A.addUser()">उपयोगकर्ता जोड़ें</button></div></section>`)};
VIEWS.settings=()=>{if(CU().role!=='admin')return shell('<div class="note b">केवल एडमिन</div>');const s=SET();
  return shell(ph('उत्पाद एवं सेटिंग','ऋण उत्पादों की ब्याज दर एवं प्रोसेसिंग शुल्क')+`<section class="sec"><h3>ऋण उत्पाद</h3><div class="tw"><table class="t"><thead><tr><th>उत्पाद का नाम</th><th>पुनर्भुगतान विधि</th><th>ब्याज दर (% वार्षिक)</th><th>प्रोसेसिंग शुल्क (% राशि का)</th></tr></thead><tbody>${Object.keys(s.products).map(k=>`<tr><td><input id="p_${k}_name" value="${esc(s.products[k].name)}"></td><td>${METHOD_DESC[k]}</td><td><input id="p_${k}_rate" type="number" step="0.01" min="0" value="${esc(s.products[k].rate)}"></td><td><input id="p_${k}_fee" type="number" step="0.01" min="0" value="${esc(s.products[k].fee)}"></td></tr>`).join('')}</tbody></table></div></section>
  <section class="sec"><h3>कंपनी एवं शाखा</h3><div class="grid"><label class="fld full"><span>कंपनी का नाम (अंग्रेज़ी)</span><input id="s_co" value="${esc(s.company)}"></label><label class="fld full"><span>कंपनी का नाम (हिंदी)</span><input id="s_cohi" value="${esc(s.companyHi)}"></label><label class="fld"><span>शाखा</span><input id="s_br" value="${esc(s.branch)}"></label><label class="fld full"><span>शाखा का पता</span><textarea id="s_addr" rows="2">${esc(s.address)}</textarea></label></div></section><div><button class="btn" onclick="A.saveSettings()">सेटिंग सहेजें</button></div>`)};

/* ============ actions ============ */
const A={go,showDoc,closeModal,R:()=>R,
 async pdf(){const el=$('#paperDoc');if(!el)return;busy(true);try{const pdf=await makePdf(el.innerHTML,A._pdf||'document.pdf');busy(false);await saveBlob(A._pdf,pdf.output('blob'),pdf)}catch(e){toast(e.message||'PDF नहीं बन सका','bad')}finally{busy(false)}},
 async viewFile(fid){const d=await getFile(fid);if(!d)return toast('फाइल नहीं मिली','bad');
   if(d.type.startsWith('image/'))modal(`<div class="m-h"><b>${esc(d.name||'')}</b><button class="btn ghost sm" onclick="A.closeModal()">बंद करें</button></div><img class="bigimg" src="${d.data}" alt="">`,true);
   else modal(`<div class="m-h"><b>${esc(d.name||'PDF')}</b><button class="btn ghost sm" onclick="A.closeModal()">बंद करें</button></div><p>PDF फाइल को डाउनलोड करके देखें।</p><button class="btn" onclick="A.dlFile('${fid}')">PDF डाउनलोड</button>`)},
 async dlFile(fid){const d=await getFile(fid);if(!d)return;const b=await (await fetch(d.data)).blob();await saveBlob(d.name||'file.pdf',b)},
 async upload(inp,appId,group,kind,multi){const files=[...inp.files];inp.value='';if(!files.length)return;busy(true);
   try{const app=clone(S.cache.apps[appId]);app[group]=app[group]||{};const old=app[group][kind]||[];let ids=multi?old.slice():[];
     for(const f of files){const d=await prepFile(f);const fid='F'+uid();await putFile(fid,{appId,kind,name:f.name,type:d.type,data:d.data,at:nowISO()});ids.push(fid)}
     app[group][kind]=ids;await put('apps',appId,app);if(!multi)for(const o of old)await delFile(o);toast('अपलोड हो गया')}
   catch(e){toast(e.message||'अपलोड विफल','bad')}finally{busy(false)}dirty=false;render()},
 async rmFile(appId,group,kind,fid){busy(true);try{const app=clone(S.cache.apps[appId]);app[group][kind]=(app[group][kind]||[]).filter(x=>x!==fid);await put('apps',appId,app);await delFile(fid)}catch(e){toast(e.message,'bad')}finally{busy(false)}dirty=false;render()},
 async startApply(){if(S.mode==='fb'&&!FB.auth.currentUser){busy(true);try{await FB.auth.signInAnonymously();await fbAttach()}catch(e){busy(false);return toast(fbErr(e),'bad')}busy(false)}
   const id=ss('cust');const a=id&&S.cache.apps[id];if(a&&a.status!=='draft')ss('cust',null);go('apply',{step:1})},
 newApply(){ss('cust',null);go('apply',{step:1})},
 prodChange(){const r=document.querySelector('input[name="f_product"]:checked');const t=$('#f_tenure');if(!t)return;if(r&&r.value!=='emi'){t.value='12';t.disabled=true}else t.disabled=false},
 async saveForm(){const o=readForm();const err=validate(o);if(err)return toast(err,'bad');busy(true);
   try{let id=ss('cust');let app=id&&S.cache.apps[id];
     if(app&&app.status==='draft'){app=clone(app);app.form=o;log(app,'आवेदन फॉर्म संशोधित')}
     else{const d=today();id='APP-'+fyCode(d)+'-'+pad(await nextNo('a'+fyCode(d)));app={status:'draft',createdAt:nowISO(),form:o,cdocs:{},log:[]};if(S.mode==='fb')app.ownerUid=FB.auth.currentUser.uid;log(app,'आवेदन फॉर्म भरा गया');ss('cust',id)}
     await put('apps',id,app);busy(false);go('apply',{step:2})}catch(e){busy(false);toast(e.message||'सहेजा नहीं जा सका','bad')}},
 async submitApp(){const id=ss('cust');const a=S.cache.apps[id];if(!a)return;busy(true);try{const app=clone(a);app.status='submitted';app.submittedAt=nowISO();log(app,'ग्राहक द्वारा आवेदन जमा','आधार, पैन एवं फोटो सहित');await put('apps',id,app);busy(false);go('apply',{step:'done'})}catch(e){busy(false);toast(e.message,'bad')}},
 async setupAdmin(){const n=$('#su_name').value.trim(),u=$('#su_user').value.trim().toLowerCase(),p=$('#su_pw').value;if(!n||!u||p.length<6)return toast('नाम, यूज़रनेम एवं 6+ अक्षर का पासवर्ड भरें','bad');
   if(S.mode==='fb'){busy(true);try{const cred=await FB.auth.createUserWithEmailAndPassword(toEmail(u),p);const b=FB.fs.batch();
       b.set(FB.fs.doc('users/'+cred.user.uid),{name:n,username:u,role:'admin',active:true,createdAt:nowISO()});b.set(FB.fs.doc('config/setup'),{by:cred.user.uid,at:nowISO()});await b.commit();await fbAttach();busy(false);go('dash')}catch(e){busy(false);toast(fbErr(e),'bad')}return}
   busy(true);try{const id='U'+uid();await put('users',id,{name:n,username:u,role:'admin',active:true,pw:await hpw(u,p),createdAt:nowISO()});ss('user',id);busy(false);go('dash')}catch(e){busy(false);toast(e.message,'bad')}},
 async login(){const u=$('#l_user').value.trim().toLowerCase(),p=$('#l_pw').value;
   if(S.mode==='fb'){if(!u||!p)return toast('यूज़रनेम एवं पासवर्ड भरें','bad');busy(true);try{await FB.auth.signInWithEmailAndPassword(toEmail(u),p);await fbAttach();if(!FB.staff){await FB.auth.signOut();await fbAttach();throw new Error('यह खाता स्टाफ के रूप में सक्रिय नहीं है – एडमिन से संपर्क करें')}busy(false);go('dash')}catch(e){busy(false);toast(e.code?fbErr(e):e.message,'bad')}return}const usr=Object.values(S.cache.users).find(x=>x.username===u);
   if(!usr||usr.pw!==await hpw(u,p))return toast('यूज़रनेम या पासवर्ड गलत है','bad');if(usr.active===false)return toast('यह खाता निष्क्रिय है – एडमिन से संपर्क करें','bad');ss('user',usr.id);go('dash')},
 async logout(){ss('user',null);if(S.mode==='fb'){busy(true);try{await FB.auth.signOut();await fbAttach()}catch(e){}busy(false)}go('landing')},
 async addUser(){const n=$('#u_name').value.trim(),u=$('#u_user').value.trim().toLowerCase(),p=$('#u_pw').value,r=$('#u_role').value;
   if(!n||!u||p.length<6)return toast('नाम, यूज़रनेम एवं 6+ अक्षर का पासवर्ड भरें','bad');if(Object.values(S.cache.users).some(x=>x.username===u))return toast('यह यूज़रनेम पहले से है','bad');
   if(S.mode==='fb'){busy(true);try{const sec=firebase.apps.find(a=>a.name==='sec')||firebase.initializeApp(FBC,'sec');try{await sec.auth().setPersistence(firebase.auth.Auth.Persistence.NONE)}catch(e){}
       const cred=await sec.auth().createUserWithEmailAndPassword(toEmail(u),p);await sec.auth().signOut();await put('users',cred.user.uid,{name:n,username:u,role:r,active:true,createdAt:nowISO()});toast('उपयोगकर्ता जोड़ा गया')}catch(e){toast(e.code?fbErr(e):e.message,'bad')}busy(false);dirty=false;render();return}
   busy(true);try{await put('users','U'+uid(),{name:n,username:u,role:r,active:true,pw:await hpw(u,p),createdAt:nowISO()});toast('उपयोगकर्ता जोड़ा गया')}catch(e){toast(e.message,'bad')}busy(false);dirty=false;render()},
 async toggleUser(id){const u=clone(S.cache.users[id]);u.active=u.active===false;busy(true);try{await put('users',id,u)}catch(e){toast(e.message,'bad')}busy(false);dirty=false;render()},
 resetPw(id){modal(`<div class="m-h"><b>पासवर्ड बदलें – ${esc(S.cache.users[id].name)}</b></div><label class="fld"><span>नया पासवर्ड (6+ अक्षर)</span><input id="np" type="password"></label><div class="row"><button class="btn" onclick="A.doReset('${id}')">सहेजें</button><button class="btn ghost" onclick="A.closeModal()">रद्द</button></div>`)},
 async doReset(id){const p=$('#np').value;if(p.length<6)return toast('6+ अक्षर का पासवर्ड','bad');
   if(S.mode==='fb'){busy(true);try{await FB.auth.currentUser.updatePassword(p);toast('पासवर्ड बदल गया')}catch(e){toast(fbErr(e),'bad')}busy(false);closeModal();return}const u=clone(S.cache.users[id]);u.pw=await hpw(u.username,p);busy(true);try{await put('users',id,u);toast('पासवर्ड बदल गया')}catch(e){toast(e.message,'bad')}busy(false);closeModal()},
 async saveSettings(){const s=SET();const prods={};for(const k of Object.keys(s.products))prods[k]={name:$(`#p_${k}_name`).value.trim()||s.products[k].name,rate:$(`#p_${k}_rate`).value,fee:+$(`#p_${k}_fee`).value||0};
   busy(true);try{await put('settings','main',{company:$('#s_co').value.trim(),companyHi:$('#s_cohi').value.trim(),branch:$('#s_br').value.trim(),address:$('#s_addr').value.trim(),products:prods});toast('सेटिंग सहेजी गई')}catch(e){toast(e.message,'bad')}busy(false);dirty=false;render()},
 async forward(id){const to=$('#fw_to').value;const note=$('#fw_note').value.trim();busy(true);try{const app=clone(S.cache.apps[id]);app.assignedTo=to;app.status='forwarded';log(app,'फाइल फॉरवर्ड की गई',S.cache.users[to].name+(note?' – '+note:''));await put('apps',id,app);toast('फॉरवर्ड हो गया')}catch(e){toast(e.message,'bad')}busy(false);dirty=false;render()},
 async decide(id,ok){const sv={date:$('#s_date').value,by:$('#s_by').value.trim(),activity:$('#s_act').value,remarks:$('#s_rem').value.trim(),amount:+$('#s_amt').value||0};const reason=$('#s_reason').value.trim();
   if(!sv.date||!sv.by||!sv.remarks)return toast('सर्वे दिनांक, सर्वेकर्ता एवं टिप्पणी भरें','bad');if(ok&&!(sv.amount>0))return toast('अनुशंसित राशि भरें','bad');if(!ok&&!reason)return toast('अस्वीकृति का कारण लिखें','bad');
   busy(true);try{const app=clone(S.cache.apps[id]);app.survey=sv;app.decision={result:ok?'स्वीकार':'अस्वीकार',reason,by:CU().name,at:nowISO()};app.status=ok?'approved':'rejected';
     log(app,'सर्वे दर्ज',sv.by+' – '+fmtD(sv.date));log(app,ok?'आवेदन स्वीकार':'आवेदन अस्वीकार',ok?'अनुशंसित '+fmt(sv.amount):reason);await put('apps',id,app);toast(ok?'आवेदन स्वीकार किया गया – अब फाइल दस्तावेज़ अपलोड करें':'आवेदन अस्वीकार किया गया')}catch(e){toast(e.message,'bad')}busy(false);dirty=false;render()},
 termsProd(){const m=$('#t_method').value;const pr=SET().products[m];$('#t_rate').value=pr.rate;const t=$('#t_tenure');if(m==='emi')t.readOnly=false;else{t.value=12;t.readOnly=true}$('#t_fee').value=r2((+$('#t_amount').value||0)*(+pr.fee||0)/100);A.calcTerms()},
 calcTerms(){const a=+$('#t_amount').value||0,m=$('#t_method').value,r=$('#t_rate').value,n=+$('#t_tenure').value||0,fee=+$('#t_fee').value||0;const el=$('#t_prev');if(!el)return;
   if(!(a>0)||r===''||!(n>0)){el.innerHTML='<div><span>राशि, ब्याज दर एवं अवधि भरें</span></div>';return}const rows=genSchedule(a,r,n,m,today());
   el.innerHTML=`<div><span>प्रथम किस्त</span><b>${fmt(rows[0].amt)}</b></div><div><span>कुल ब्याज</span><b>${fmt(rows.reduce((s,x)=>s+x.int,0))}</b></div><div><span>शुद्ध वितरण</span><b>${fmt(a-fee)}</b></div><div><span>सक्षम प्राधिकारी</span><b style="text-align:right">${authority(a)}</b></div>`},
 async sanction(id){const amount=r2($('#t_amount').value),method=$('#t_method').value,rate=$('#t_rate').value,tenure=+$('#t_tenure').value,fee=r2($('#t_fee').value),validDays=+$('#t_valid').value||30;
   if(!(amount>0))return toast('स्वीकृत राशि भरें','bad');if(rate===''||+rate<0)return toast('ब्याज दर भरें','bad');if(!(tenure>0))return toast('अवधि भरें','bad');if(method!=='emi'&&tenure!==12)return toast('इस उत्पाद की अवधि 12 माह है','bad');if(fee>=amount)return toast('प्रोसेसिंग शुल्क गलत है','bad');
   busy(true);try{const d=today(),fy=fyCode(d);const sno='SAN-'+fy+'-'+pad(await nextNo('s'+fy));const lno='LN-'+fy+'-'+pad(await nextNo('l'+fy));const app=clone(S.cache.apps[id]);
     app.sanction={sno,date:d,loanNo:lno,amount,method,rate:+rate,tenure,fee,validDays,cond:$('#t_cond').value.trim(),security:$('#t_sec').value.trim(),authority:authority(amount),by:CU().name};app.status='sanctioned';log(app,'स्वीकृति पत्र जनरेट',sno+' – '+fmt(amount));
     await put('apps',id,app);busy(false);dirty=false;render();showDoc('sanction',id)}catch(e){busy(false);toast(e.message,'bad')}},
 async markReady(id){if(!$('#acc_ok').checked)return toast('पुष्टि करें कि ग्राहक ने नियम व शर्तें स्वीकार की हैं','bad');busy(true);try{const app=clone(S.cache.apps[id]);app.status='ready';app.termsAccepted={by:CU().name,at:nowISO()};log(app,'हस्ताक्षरित स्वीकृति पत्र अपलोड – नियम व शर्तें स्वीकार','लेखाकार को वितरण हेतु भेजा गया');await put('apps',id,app);toast('फाइल लेखाकार एवं शाखा प्रबंधक के डैशबोर्ड पर भेजी गई')}catch(e){toast(e.message,'bad')}busy(false);dirty=false;render()},
 async disburse(id){const d={date:$('#d_date').value,bankName:$('#d_bank').value.trim(),accNo:$('#d_acc').value.replace(/\s/g,''),ifsc:$('#d_ifsc').value.trim().toUpperCase(),mode:$('#d_mode').value,ref:$('#d_ref').value.trim()};
   if(!d.date)return toast('दिनांक भरें','bad');if(d.mode!=='नकद'){if(!PATS.acc[0].test(d.accNo))return toast('सही खाता संख्या भरें','bad');if(d.accNo!==$('#d_acc2').value.replace(/\s/g,''))return toast('दोनों खाता संख्याएँ मेल नहीं खातीं','bad');if(!PATS.ifsc[0].test(d.ifsc))return toast('सही IFSC भरें','bad');if(!d.ref)return toast('UTR / संदर्भ सं. भरें','bad')}
   busy(true);try{const app=clone(S.cache.apps[id]);if(app.status!=='ready')throw new Error('यह फाइल वितरण हेतु तैयार नहीं है');const sc=app.sanction;const sch=genSchedule(sc.amount,sc.rate,sc.tenure,sc.method,d.date);const fy=fyCode(d.date);
     const vno='VCH-'+fy+'-'+pad(await nextNo('v'+fy));const acc=d.mode==='नकद'?'CASH':'BANK';const fee=r2(sc.fee||0),net=r2(sc.amount-fee);
     const lines=[{a:'LOAN',dr:sc.amount,cr:0},{a:acc,dr:0,cr:net}];if(fee>0)lines.push({a:'FEE',dr:0,cr:fee});
     await put('entries',vno,{date:d.date,vno,kind:'disburse',appId:id,loanNo:sc.loanNo,party:app.form.name,narration:`ऋण वितरण ${sc.loanNo} – ${d.mode} ${d.ref}`.trim()+(fee>0?` (प्रोसेसिंग शुल्क ${fmt(fee)})`:''),mode:acc,lines,at:nowISO(),by:CU().name});
     app.loan={loanNo:sc.loanNo,disbDate:d.date,principal:sc.amount,rate:sc.rate,method:sc.method,tenure:sc.tenure,fee,net,mode:d.mode,ref:d.ref,bankName:d.bankName,accNo:d.accNo,ifsc:d.ifsc,schedule:sch,status:'active',vno};
     app.status='active';log(app,'ऋण वितरित',`${vno} – ${fmt(net)} – ${d.mode} ${d.ref}`);await put('apps',id,app);busy(false);toast('ऋण वितरित – लेजर एवं कैशबुक में प्रविष्टि हो गई');go('loan',{id})}catch(e){busy(false);toast(e.message,'bad')}},
 async collect(id){const amount=r2($('#c_amt').value),date=$('#c_date').value,mode=$('#c_mode').value,ref=$('#c_ref').value.trim();
   const a0=S.cache.apps[id];const st=loanStats(a0.loan);if(!(amount>0))return toast('राशि भरें','bad');if(amount>st.totalOut+0.004)return toast('अधिकतम '+fmt(st.totalOut)+' जमा हो सकता है','bad');if(!date)return toast('दिनांक भरें','bad');if(date<a0.loan.disbDate)return toast('जमा दिनांक वितरण दिनांक से पहले नहीं हो सकती','bad');if(mode!=='नकद'&&!ref)return toast('लेन-देन संदर्भ सं. भरें','bad');
   busy(true);try{const app=clone(a0);const L=app.loan;const al=allocate(L,amount);const fy=fyCode(date);const rno='RCP-'+fy+'-'+pad(await nextNo('r'+fy));const acc=mode==='नकद'?'CASH':'BANK';
     const lines=[{a:acc,dr:amount,cr:0}];if(al.P>0)lines.push({a:'LOAN',dr:0,cr:al.P});if(al.I>0)lines.push({a:'INT',dr:0,cr:al.I});
     L.schedule=al.sch;const st2=loanStats(L);if(st2.totalOut<=0.004){L.status='closed';L.closedOn=date;app.status='closed'}
     const rc={rno,date,amount,P:al.P,I:al.I,mode,ref,balP:st2.pOut,nextDate:st2.next?st2.next.due:'',nextAmt:st2.nextDue,loanNo:L.loanNo,name:app.form.name,memberId:app.form.memberId,by:CU().name};
     await put('entries',rno,{date,vno:rno,kind:'receipt',appId:id,loanNo:L.loanNo,party:app.form.name,narration:`किस्त प्राप्ति ${L.loanNo} – मूलधन ${fmt(al.P)}, ब्याज ${fmt(al.I)}`,mode:acc,lines,receipt:rc,at:nowISO(),by:CU().name});
     log(app,'किस्त जमा',`${rno} – ${fmt(amount)} (मूलधन ${fmt(al.P)}, ब्याज ${fmt(al.I)})`+(app.status==='closed'?' – ऋण पूर्ण चुकता':''));await put('apps',id,app);busy(false);
     dirty=false;go('loan',{id});showDoc('receipt',rno)}catch(e){busy(false);toast(e.message,'bad')}},
};
window.A=A;window.$=$;

(async()=>{await initStore();render()})();
</script>
